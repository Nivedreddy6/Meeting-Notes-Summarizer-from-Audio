  <text x="236" y="132" font-family="sans-serif" font-size="9" font-weight="700" fill="#fef08a">ARR Target: <tspan fill="#34d399" font-weight="900">$12.4M ↑</tspan></text>
  <!-- Sparkline Path -->
  <path d="M 236 156 L 260 152 L 285 154 L 315 142 L 345 146 L 375 130" fill="none" stroke="#34d399" stroke-width="2" class="spark-line" />
  <circle cx="375" cy="130" r="3" fill="#34d399" />

  <!-- Macro KPIs -->
  <rect x="228" y="172" width="160" height="20" rx="3" fill="#2d1c04" />
  <text x="236" y="185" font-family="sans-serif" font-size="8.5" fill="#fde68a">• 78% Gross Margin Target</text>
  <rect x="228" y="196" width="160" height="20" rx="3" fill="#2d1c04" />
  <text x="236" y="209" font-family="sans-serif" font-size="8.5" fill="#fde68a">• Critical Strategic Blockers</text>

