  <text x="694" y="244" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#d8b4fe">Engineering RFCs &amp; Specs</text>


  <!-- ================= PERSONA 5: CLIENT CONTRACT PROPOSAL (Discovery) ================= -->
  <!-- Corporate Proposal Card (x=797, y=70, w=180, h=195) -->
  <rect x="797" y="75" width="180" height="190" rx="10" fill="#241706" stroke="#f59e0b" stroke-width="1.8" />
  <circle cx="819" cy="98" r="10" fill="#b45309" />
  <text x="819" y="102" text-anchor="middle" font-size="11">🤝</text>
  <text x="836" y="96" font-family="sans-serif" font-size="12" font-weight="900" fill="#fef3c7">Client Discovery</text>
  <text x="836" y="109" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#f59e0b">SOLUTIONS DIRECTOR</text>

  <!-- Proposal Contract Details -->
  <rect x="807" y="120" width="160" height="85" rx="5" fill="#451a03" stroke="#b45309" stroke-width="1" />
  <text x="815" y="136" font-family="sans-serif" font-size="9" font-weight="800" fill="#fef3c7">Deal: Enterprise Migration</text>
  <text x="815" y="152" font-family="sans-serif" font-size="8.5" fill="#fde68a">• Pain: Legacy CRM latency</text>
  <text x="815" y="167" font-family="sans-serif" font-size="8.5" fill="#fde68a">• Timeline: 90-Day Rollout</text>
  <!-- Compliance checkmark chips -->
  <rect x="815" y="174" width="42" height="14" rx="2" fill="#78350f" />
  <text x="836" y="184" text-anchor="middle" font-size="7.5" font-weight="800" fill="#34d399">✓ SOC-2</text>
  <rect x="862" y="174" width="42" height="14" rx="2" fill="#78350f" />
  <text x="883" y="184" text-anchor="middle" font-size="7.5" font-weight="800" fill="#34d399">✓ HIPAA</text>
  <rect x="909" y="174" width="42" height="14" rx="2" fill="#78350f" />
  <text x="930" y="184" text-anchor="middle" font-size="7.5" font-weight="800" fill="#34d399">✓ GDPR</text>

  <rect x="807" y="215" width="160" height="38" rx="5" fill="#78350f" />
  <text x="887" y="230" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#ffffff">SOLUTIONS DISCOVERY</text>
  <text x="887" y="244" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#fef3c7">Sales &amp; Discovery Calls</text>
</svg>
