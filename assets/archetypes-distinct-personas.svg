<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="archCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <!-- Gold Luxury Gradient for Executive -->
    <linearGradient id="goldExec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <style>
      @keyframes sparkPulse {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke-width: 2.5; }
      }
      .spark-line { animation: sparkPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="280" rx="16" fill="url(#archCanvasBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title Header -->
  <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#38bdf8">SPECIALIZED AI PERSONA PROFILES</text>
  <text x="35" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#ffffff">5 Tailored Extraction Archetypes with Dedicated Visual Identities</text>


  <!-- ================= PERSONA 1: LEGAL CLIPBOARD SCROLL (Full Minutes) ================= -->
  <!-- Clipboard Body (x=25, y=70, w=180, h=195) -->
  <rect x="25" y="75" width="180" height="190" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.8" />
  <!-- Clipboard Top Brass Clip -->
  <rect x="80" y="66" width="70" height="18" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />
  <circle cx="115" cy="75" r="3.5" fill="#e2e8f0" />
  <text x="115" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#c7d2fe">📝 Full Minutes</text>
  <text x="115" y="118" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#818cf8">ADMINISTRATIVE SCRIBE</text>

  <!-- Document Line Items -->
  <rect x="35" y="128" width="160" height="22" rx="3" fill="#1e293b" />
  <text x="42" y="142" font-family="sans-serif" font-size="9" fill="#e2e8f0">• Full discussion transcript</text>
  <rect x="35" y="154" width="160" height="22" rx="3" fill="#1e293b" />
  <text x="42" y="168" font-family="sans-serif" font-size="9" fill="#e2e8f0">• Topic duration breakdown</text>
  <rect x="35" y="180" width="160" height="22" rx="3" fill="#1e293b" />
  <text x="42" y="194" font-family="sans-serif" font-size="9" fill="#e2e8f0">• All action items &amp; owners</text>

  <!-- Official Notary Stamp at bottom -->
  <rect x="35" y="210" width="160" height="42" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="115" y="226" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#a5b4fc">OFFICIAL RECORD SEAL</text>
  <text x="115" y="242" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#cbd5e1">All-Hands &amp; Board Meetings</text>


  <!-- ================= PERSONA 2: LUXURY GOLD C-SUITE BRIEF (Executive) ================= -->
  <!-- Gold Bordered Card (x=218, y=70, w=180, h=195) -->
  <rect x="218" y="75" width="180" height="190" rx="10" fill="#1c1404" stroke="url(#goldExec)" stroke-width="2" />
  <circle cx="240" cy="98" r="10" fill="#78350f" />
  <text x="240" y="102" text-anchor="middle" font-size="11">👑</text>
