  <rect x="421" y="215" width="160" height="38" rx="5" fill="#064e3b" />
  <text x="501" y="230" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#ffffff">SPRINT COMMITTED</text>
  <text x="501" y="244" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6ee7b7">Done • In-Progress • Blockers</text>


