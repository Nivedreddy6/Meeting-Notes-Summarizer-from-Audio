    <line x1="604" y1="120" x2="784" y2="120" />
    <line x1="604" y1="160" x2="784" y2="160" />
    <line x1="604" y1="200" x2="784" y2="200" />
    <line x1="664" y1="75" x2="664" y2="265" />
    <line x1="724" y1="75" x2="724" y2="265" />
  </g>

