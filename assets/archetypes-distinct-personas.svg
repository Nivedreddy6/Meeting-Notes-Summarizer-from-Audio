  <rect x="411" y="75" width="180" height="190" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.8" />
  <circle cx="433" cy="98" r="10" fill="#047857" />
  <text x="433" y="102" text-anchor="middle" font-size="11">🏃</text>
  <text x="450" y="96" font-family="sans-serif" font-size="12" font-weight="900" fill="#a7f3d0">Daily Scrum</text>
