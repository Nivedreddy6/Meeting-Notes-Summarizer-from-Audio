  <text x="626" y="102" text-anchor="middle" font-size="11">🛠️</text>
  <text x="643" y="96" font-family="sans-serif" font-size="12" font-weight="900" fill="#f3e8ff">Architecture</text>
  <text x="643" y="109" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#c084fc">PRINCIPAL ARCHITECT</text>

  <!-- ADR Technical Schematic Box -->
  <rect x="614" y="120" width="160" height="85" rx="5" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
  <text x="622" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#38bdf8">ADR-42: Redis Sentinel</text>
  <text x="622" y="152" font-family="sans-serif" font-size="8.5" fill="#cbd5e1">• Failover SLA: &lt; 3.0s</text>
  <text x="622" y="167" font-family="sans-serif" font-size="8.5" fill="#cbd5e1">• Connection Pool: 5k req/s</text>
  <text x="622" y="182" font-family="sans-serif" font-size="8.5" fill="#cbd5e1">• Dual-write shadow mode</text>
  <text x="622" y="197" font-family="sans-serif" font-size="8" font-weight="700" fill="#a7f3d0">✓ Trade-Offs Documented</text>

  <rect x="614" y="215" width="160" height="38" rx="5" fill="#581c87" />
