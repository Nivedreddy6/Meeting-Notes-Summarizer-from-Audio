<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <style>
      @keyframes uiLaser {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes chatDotPulse {
        0%, 100% { fill-opacity: 0.3; r: 3.5px; }
        50% { fill-opacity: 1; r: 5.5px; }
      }
      .ui-laser-border {
        stroke-dasharray: 80, 25;
        animation: uiLaser 4s linear infinite;
      }
      .chat-pulse-1 { animation: chatDotPulse 1.2s infinite; }
      .chat-pulse-2 { animation: chatDotPulse 1.2s infinite 0.2s; }
      .chat-pulse-3 { animation: chatDotPulse 1.2s infinite 0.4s; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="270" rx="14" fill="url(#uiBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="1000" height="38" rx="14" fill="#0f172a" fill-opacity="0.95" />
  <circle cx="25" cy="19" r="5" fill="#ef4444" />
  <circle cx="42" cy="19" r="5" fill="#eab308" />
  <circle cx="59" cy="19" r="5" fill="#22c55e" />
  <text x="82" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">OmniNote Intelligence Deck — React 19 Workspace</text>
  <rect x="850" y="9" width="130" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="915" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#c7d2fe">● LIVE REASONING</text>

  <!-- Tab Bar -->
  <!-- Tab 1: Summary (Active) -->
  <rect x="25" y="48" width="135" height="28" rx="6" fill="url(#activeTabGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="92" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">📋 Overview &amp; Hero</text>

  <!-- Tab 2: Action Items -->
  <rect x="168" y="48" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="240" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">✅ Action Items (5)</text>

  <!-- Tab 3: Decisions -->
  <rect x="321" y="48" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="393" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">💡 Decisions (3)</text>

  <!-- Tab 4: Agenda Topics -->
  <rect x="474" y="48" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="546" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">📊 Agenda Timeline</text>

  <!-- Tab 5: Transcript -->
  <rect x="627" y="48" width="150" height="28" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <text x="702" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">📜 Audio Transcript</text>

  <!-- Tab 6: Copilot -->
  <rect x="785" y="48" width="190" height="28" rx="6" fill="#3b0764" fill-opacity="0.7" stroke="#a855f7" stroke-width="1" />
  <text x="880" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#f0abfc">💬 Grounded Copilot (AI)</text>

  <!-- Main Content Layout: Two Panes -->

  <!-- Left Pane: Meeting Summary & Actions Card -->
  <rect x="25" y="88" width="580" height="165" rx="10" fill="#0f172a" fill-opacity="0.95" />
  <rect x="25" y="88" width="580" height="165" rx="10" fill="none" stroke="#6366f1" stroke-width="1.6" class="ui-laser-border" />
  <!-- Title & Meta -->
  <text x="45" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">Sprint 42 Architecture &amp; Scalability Sync</text>
  <rect x="420" y="99" width="85" height="18" rx="4" fill="#065f46" />
  <text x="462" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">✓ HIGH ALIGNMENT</text>
  <rect x="512" y="99" width="75" height="18" rx="4" fill="#1e1b4b" />
  <text x="549" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#a5b4fc">⏱ 42m 18s</text>

  <!-- Metric Badges Row -->
  <rect x="45" y="125" width="115" height="22" rx="5" fill="#1e293b" />
  <text x="55" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Speakers: <tspan fill="#38bdf8" font-weight="800">4 Diarized</tspan></text>

  <rect x="170" y="125" width="125" height="22" rx="5" fill="#1e293b" />
  <text x="180" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Key Topics: <tspan fill="#34d399" font-weight="800">5 Breakdown</tspan></text>

  <rect x="305" y="125" width="145" height="22" rx="5" fill="#1e293b" />
  <text x="315" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Decisions: <tspan fill="#c084fc" font-weight="800">3 Consensus ADRs</tspan></text>

  <!-- Live Action Preview Rows -->
  <rect x="45" y="157" width="540" height="38" rx="6" fill="#131e33" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="65" cy="176" r="8" fill="#047857" />
  <text x="65" y="180" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">✓</text>
  <text x="82" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0">Benchmark Redis Sentinel failover under 5,000 req/sec</text>
  <rect x="430" y="167" width="68" height="18" rx="4" fill="#7f1d1d" />
  <text x="464" y="179" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#fca5a5">HIGH PRIORITY</text>
  <text x="510" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">@Marcus (Fri)</text>

  <rect x="45" y="202" width="540" height="38" rx="6" fill="#131e33" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="65" cy="221" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="82" y="219" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8">Update OpenAPI contract for billing reconciliation webhook</text>
  <rect x="430" y="212" width="68" height="18" rx="4" fill="#854d0e" />
  <text x="464" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#fef08a">MED PRIORITY</text>
  <text x="510" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#c084fc">@Elena (Tue)</text>

  <!-- Right Pane: Meeting Copilot Chat Window -->
  <rect x="620" y="88" width="355" height="165" rx="10" fill="#140f28" fill-opacity="0.95" />
  <rect x="620" y="88" width="355" height="165" rx="10" fill="none" stroke="#a855f7" stroke-width="1.6" class="ui-laser-border" />
  <text x="638" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#f0abfc">💬 Meeting Copilot • Grounded Q&amp;A</text>

  <!-- User Query Bubble -->
  <rect x="638" y="124" width="285" height="28" rx="6" fill="#2e1065" stroke="#9333ea" stroke-opacity="0.4" stroke-width="1" />
  <text x="648" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#e9d5ff">"What did Marcus commit to regarding failover?"</text>

  <!-- Copilot Answer Bubble -->
  <rect x="638" y="160" width="320" height="80" rx="6" fill="#1e1b4b" fill-opacity="0.95" stroke="#6366f1" stroke-width="1.2" />
  <circle cx="652" cy="176" r="4" fill="#38bdf8" class="chat-pulse-1" />
  <circle cx="662" cy="176" r="4" fill="#818cf8" class="chat-pulse-2" />
  <circle cx="672" cy="176" r="4" fill="#c084fc" class="chat-pulse-3" />
  <text x="684" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">OmniNote Copilot:</text>
  <text x="648" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#e0e7ff">At timestamp <tspan fill="#38bdf8" font-weight="800">18:24</tspan>, Marcus confirmed that Redis Sentinel</text>
  <text x="648" y="216" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#e0e7ff">guarantees failover in &lt;3s with zero data loss,</text>
  <text x="648" y="232" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#e0e7ff">and will benchmark connection pools by Friday.</text>
</svg>
