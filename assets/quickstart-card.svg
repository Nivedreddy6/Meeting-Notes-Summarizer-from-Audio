<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#0b101e" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes termLaser {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      .cursor-blink { animation: blinkCursor 0.8s infinite; }
      .term-border {
        stroke-dasharray: 100, 30;
        animation: termLaser 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="240" rx="14" fill="url(#termBg)" />
  <rect width="1000" height="240" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.8" class="term-border" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="34" rx="14" fill="#0f172a" fill-opacity="0.95" />
  <circle cx="22" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#eab308" />
  <circle cx="54" cy="17" r="4.5" fill="#22c55e" />
  <text x="75" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#94a3b8">bash — Quick Start Guide (1-Minute Setup)</text>
  <rect x="830" y="8" width="150" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="905" y="21" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#c7d2fe">● PORT: 3000</text>

  <!-- Terminal Content: 4 Columns / Command Blocks -->

  <!-- STEP 1: CLONE -->
  <rect x="25" y="48" width="220" height="172" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
  <rect x="35" y="58" width="70" height="18" rx="4" fill="#0284c7" />
  <text x="70" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">STEP 1</text>
  <text x="115" y="71" font-family="sans-serif" font-size="11" font-weight="700" fill="#bae6fd">Clone Repo</text>
  <text x="35" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">$ git clone</text>
  <text x="35" y="120" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">github.com/Nivedreddy6/</text>
  <text x="35" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">Meeting-Notes...</text>
  <text x="35" y="165" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">$ cd Meeting-Notes</text>
  <rect x="35" y="185" width="200" height="22" rx="4" fill="#075985" fill-opacity="0.4" />
  <text x="42" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8">✓ Cloned in ~2 seconds</text>

  <!-- STEP 2: INSTALL -->
  <rect x="265" y="48" width="220" height="172" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
  <rect x="275" y="58" width="70" height="18" rx="4" fill="#4338ca" />
  <text x="310" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">STEP 2</text>
  <text x="355" y="71" font-family="sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Install</text>
  <text x="275" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">$ npm install</text>
  <text x="275" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">Installs React 19, Vite,</text>
  <text x="275" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8">and Lucide icons.</text>
  <text x="275" y="165" font-family="sans-serif" font-size="10" fill="#6ee7b7">Zero native binaries</text>
  <rect x="275" y="185" width="200" height="22" rx="4" fill="#312e81" fill-opacity="0.4" />
  <text x="282" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#818cf8">✓ Clean npm build</text>

  <!-- STEP 3: CONFIGURE -->
  <rect x="505" y="48" width="220" height="172" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
  <rect x="515" y="58" width="70" height="18" rx="4" fill="#9333ea" />
  <text x="550" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">STEP 3</text>
  <text x="595" y="71" font-family="sans-serif" font-size="11" font-weight="700" fill="#f3e8ff">Configure</text>
  <text x="515" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8"># create .env</text>
  <text x="515" y="124" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc">GEMINI_API_KEY=AIzaSy...</text>
  <text x="515" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc">PORT=3000</text>
  <text x="515" y="168" font-family="sans-serif" font-size="9.5" fill="#94a3b8">(Or paste in web UI)</text>
  <rect x="515" y="185" width="200" height="22" rx="4" fill="#581c87" fill-opacity="0.4" />
  <text x="522" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#c084fc">✓ Free API key in Google AI</text>

  <!-- STEP 4: LAUNCH -->
  <rect x="745" y="48" width="230" height="172" rx="8" fill="#062e24" stroke="#059669" stroke-width="1.4" />
  <rect x="755" y="58" width="70" height="18" rx="4" fill="#047857" />
  <text x="790" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">STEP 4</text>
  <text x="835" y="71" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Launch App</text>
  <rect x="755" y="90" width="210" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="860" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#ffffff">⚡ start.bat (1-Click)</text>
  <text x="755" y="136" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">$ npm run build</text>
  <text x="755" y="154" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">$ node server.js</text>
  <text x="755" y="174" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">Ready on :3000<tspan fill="#38bdf8" class="cursor-blink">_</tspan></text>
  <rect x="755" y="185" width="210" height="22" rx="4" fill="#047857" />
  <text x="860" y="200" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">🚀 Open http://localhost:3000</text>
</svg>
