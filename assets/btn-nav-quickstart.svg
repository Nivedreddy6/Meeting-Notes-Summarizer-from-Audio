<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 32" width="130" height="32">
  <defs>
    <!-- Dark Glass Capsule Background -->
    <linearGradient id="bgQuick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a070e" />
      <stop offset="50%" stop-color="#140f1a" />
      <stop offset="100%" stop-color="#08050c" />
    </linearGradient>

    <!-- Glowing Orange Border -->
    <linearGradient id="borderQuick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Diagonal Specular Gloss Sheen -->
    <linearGradient id="sheenQuick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipQuick">
      <rect x="1.5" y="1.5" width="127" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseQuick {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.6)) drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(251, 146, 60, 0.9)) drop-shadow(0 0 12px rgba(249, 115, 22, 0.6)); }
      }
      .pill-base-quick {
        animation: glowPulseQuick 2.5s ease-in-out infinite alternate;
      }
      @keyframes chevronNudgeQuick {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-quick {
        animation: chevronNudgeQuick 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Glowing Outer Pill Capsule -->
  <g class="pill-base-quick">
    <rect x="1.5" y="1.5" width="127" height="29" rx="14.5" fill="url(#bgQuick)" stroke="url(#borderQuick)" stroke-width="1.8" />
  </g>

  <!-- Diagonal Specular Glass Reflection (Clipped to Pill) -->
  <g clip-path="url(#pillClipQuick)">
    <path d="M 65 0 L 98 0 L 130 32 L 97 32 Z" fill="url(#sheenQuick)" />
    <!-- Top-Half Subtle Curved Gloss Highlight -->
    <rect x="5" y="2.5" width="120" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: Pulsing Electric Lightning Bolt -->
  <g>
    <polygon points="18,6 12,17 17,17 15,25 22,14 17,14" fill="#f59e0b" stroke="#fbbf24" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.3s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Button Text Label -->
  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Quickstart</text>

  <!-- Right Animated Chevron -->
  <g class="chev-quick">
    <path d="M 114 12 L 118 16 L 114 20" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
