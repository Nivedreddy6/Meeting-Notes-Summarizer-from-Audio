<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 44" width="175" height="44">
  <defs>
    <linearGradient id="bgRepo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021412" />
      <stop offset="50%" stop-color="#042622" />
      <stop offset="100%" stop-color="#010e0c" />
    </linearGradient>

    <linearGradient id="borderRepo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="glossTopRepo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="sweepGleamRepo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#5eead4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipRepo">
      <rect x="2" y="2" width="171" height="40" rx="20" />
    </clipPath>

    <style>
      @keyframes neonBreatheRepo {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(20, 184, 166, 0.7)) drop-shadow(0 0 10px rgba(20, 184, 166, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 9px rgba(45, 212, 191, 1)) drop-shadow(0 0 18px rgba(20, 184, 166, 0.8));
        }
      }

      @keyframes neonFlickerRepo {
        0%, 100% { opacity: 1; }
        44% { opacity: 1; }
        45% { opacity: 0.82; }
        46% { opacity: 1; }
        80% { opacity: 1; }
        81% { opacity: 0.77; }
        82% { opacity: 1; }
      }

      @keyframes gleamMoveRepo {
        0% { transform: translateX(-100px); }
        40%, 100% { transform: translateX(200px); }
      }

      @keyframes chevronNudgeRepo {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }

      .btn-outer-repo {
        animation: neonBreatheRepo 2.4s ease-in-out infinite alternate, neonFlickerRepo 4.7s infinite;
      }

      .gleam-runner-repo {
        animation: gleamMoveRepo 3.5s ease-in-out infinite;
      }

      .chevron-arrow-repo {
        animation: chevronNudgeRepo 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="btn-outer-repo">
    <rect x="2" y="2" width="171" height="40" rx="20" fill="url(#bgRepo)" stroke="url(#borderRepo)" stroke-width="2.4" />
  </g>

  <g clip-path="url(#pillClipRepo)">
    <rect x="6" y="4" width="163" height="17" rx="8.5" fill="url(#glossTopRepo)" />
    <ellipse cx="87" cy="40" rx="60" ry="2" fill="#14b8a6" opacity="0.3" />
    <rect class="gleam-runner-repo" x="0" y="0" width="35" height="44" fill="url(#sweepGleamRepo)" transform="skewX(-20)" />
  </g>

  <text x="22" y="27" font-size="16" text-anchor="middle">📁</text>
  <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.4">Repo Tree</text>

  <g class="chevron-arrow-repo">
    <text x="154" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#5eead4">&gt;</text>
  </g>
</svg>
