<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 46" width="175" height="46">
  <defs>
    <linearGradient id="bgArchp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141002" />
      <stop offset="50%" stop-color="#241c04" />
      <stop offset="100%" stop-color="#0e0b01" />
    </linearGradient>

    <linearGradient id="glowArchp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="sheenArchp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipArchp">
      <rect x="2" y="2" width="171" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseArchp {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(234, 179, 8, 0.5)) drop-shadow(0 0 8px rgba(234, 179, 8, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(253, 224, 71, 0.9)) drop-shadow(0 0 16px rgba(234, 179, 8, 0.6));
        }
      }
      .pill-container-archp {
        animation: neonPulseArchp 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
    </style>
  </defs>

  <g class="pill-container-archp">
    <rect x="2" y="2" width="171" height="42" rx="21" fill="url(#bgArchp)" stroke="url(#glowArchp)" stroke-width="2.2" />

    <g clip-path="url(#pillClipArchp)">
      <path d="M 95 0 L 140 0 L 175 46 L 130 46 Z" fill="url(#sheenArchp)" />
      <ellipse cx="88" cy="5" rx="72" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <text x="22" y="28" font-size="16" text-anchor="middle">🎯</text>
    <text x="89" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Archetypes</text>
    <text x="154" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fde047">&gt;</text>
  </g>
</svg>
