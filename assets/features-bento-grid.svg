    <rect x="712" y="260" width="3" height="10" rx="1" />
    <rect x="718" y="256" width="3" height="16" rx="1" />
    <rect x="724" y="252" width="3" height="22" rx="1" />
    <rect x="730" y="255" width="3" height="18" rx="1" />
    <rect x="736" y="250" width="3" height="26" rx="1" fill="#38bdf8" />
    <rect x="742" y="258" width="3" height="14" rx="1" />
    <rect x="748" y="252" width="3" height="22" rx="1" />
    <rect x="754" y="260" width="3" height="10" rx="1" />
  </g>
  <text x="880" y="268" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fde68a">18:24 / 42:00</text>

  <!-- Speed Toggles -->
  <rect x="702" y="288" width="45" height="22" rx="4" fill="#78350f" />
  <text x="724" y="303" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fde68a">1x</text>
  <rect x="752" y="288" width="48" height="22" rx="4" fill="#78350f" />
  <text x="776" y="303" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fde68a">1.25x</text>
  <rect x="805" y="288" width="48" height="22" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
  <text x="829" y="303" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">1.5x</text>
  <rect x="858" y="288" width="45" height="22" rx="4" fill="#78350f" />
  <text x="880" y="303" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fde68a">2x</text>

  <!-- Export Format Pills -->
  <rect x="702" y="320" width="256" height="42" rx="6" fill="#451a03" />
