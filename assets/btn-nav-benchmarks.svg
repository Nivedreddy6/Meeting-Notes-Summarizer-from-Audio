<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 133 32" width="133" height="32">
  <defs>
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140404" />
      <stop offset="50%" stop-color="#240707" />
      <stop offset="100%" stop-color="#0e0202" />
    </linearGradient>

    <linearGradient id="borderBench" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="sheenBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipBench">
      <rect x="1.5" y="1.5" width="130" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseBench {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(239, 68, 68, 0.6)) drop-shadow(0 0 6px rgba(239, 68, 68, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.9)) drop-shadow(0 0 12px rgba(239, 68, 68, 0.6)); }
      }
      .pill-base-bench {
        animation: glowPulseBench 2.5s ease-in-out infinite alternate;
      }
      @keyframes needleSweep {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(35deg); }
      }
      .gauge-needle {
        transform-origin: 18px 20px;
        animation: needleSweep 1.6s ease-in-out infinite;
      }
      @keyframes chevronNudgeBench {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-bench {
        animation: chevronNudgeBench 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-base-bench">
    <rect x="1.5" y="1.5" width="130" height="29" rx="14.5" fill="url(#bgBench)" stroke="url(#borderBench)" stroke-width="1.8" />
  </g>

  <g clip-path="url(#pillClipBench)">
    <path d="M 68 0 L 100 0 L 133 32 L 100 32 Z" fill="url(#sheenBench)" />
    <rect x="5" y="2.5" width="123" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: Speedometer Gauge with Animated Needle -->
  <g>
    <path d="M 12,20 A 6.5 6.5 0 1 1 24,20" fill="none" stroke="#f87171" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="18" cy="20" r="1.5" fill="#fca5a5" />
    <line class="gauge-needle" x1="18" y1="20" x2="22.5" y2="15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Benchmarks</text>

  <g class="chev-bench">
    <path d="M 117 12 L 121 16 L 117 20" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
