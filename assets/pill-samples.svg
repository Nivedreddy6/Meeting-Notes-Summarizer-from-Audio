<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 40" width="138" height="40">
  <defs>
    <linearGradient id="bgSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120a02" />
      <stop offset="50%" stop-color="#201304" />
      <stop offset="100%" stop-color="#0c0701" />
    </linearGradient>

    <linearGradient id="borderSamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="glowRingSamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="sheenSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipSamp">
      <rect x="4" y="4" width="130" height="32" rx="16" />
    </clipPath>

    <style>
      @keyframes neonBreatheSamp {
        0%, 100% { opacity: 0.35; stroke-width: 2.5; }
        50% { opacity: 0.75; stroke-width: 3.5; }
      }
      .glow-halo-samp {
        animation: neonBreatheSamp 2.2s ease-in-out infinite alternate;
      }
      @keyframes cubeFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      .cube-icon {
        animation: cubeFloat 2s ease-in-out infinite;
      }
      @keyframes chevronNudgeSamp {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-samp {
        animation: chevronNudgeSamp 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 100% ROUND OUTER GLOW AURA (Zero square edges, pure pill shape with transparent padding) -->
  <rect class="glow-halo-samp" x="2.5" y="2.5" width="133" height="35" rx="17.5" fill="none" stroke="url(#glowRingSamp)" stroke-width="2.5" />

  <!-- Main Round Pill Capsule Base -->
  <rect x="4" y="4" width="130" height="32" rx="16" fill="url(#bgSamp)" stroke="url(#borderSamp)" stroke-width="1.8" />

  <!-- Diagonal Specular Glass Reflection (Clipped to Pill) -->
  <g clip-path="url(#pillClipSamp)">
    <path d="M 69 4 L 102 4 L 134 36 L 101 36 Z" fill="url(#sheenSamp)" />
    <rect x="9" y="6.5" width="120" height="12" rx="6" fill="#ffffff" opacity="0.09" />
  </g>

  <!-- SVG Vector Icon: 3D Isometric Package Cube (Gold) -->
  <g class="cube-icon" transform="translate(4, 4)">
    <polygon points="18,10 23,13 18,16 13,13" fill="#fde047" opacity="0.9" />
    <polygon points="13,13 18,16 18,22 13,19" fill="#d97706" />
    <polygon points="18,16 23,13 23,19 18,22" fill="#b45309" />
  </g>

  <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Test Demos</text>

  <g class="chev-samp">
    <path d="M 118 16 L 122 20 L 118 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
