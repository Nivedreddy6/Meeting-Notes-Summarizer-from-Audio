<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 32" width="118" height="32">
  <defs>
    <linearGradient id="bgFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0414" />
      <stop offset="50%" stop-color="#1c0828" />
      <stop offset="100%" stop-color="#0a020f" />
    </linearGradient>

    <linearGradient id="borderFeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sheenFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipFeat">
      <rect x="1.5" y="1.5" width="115" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseFeat {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(217, 70, 239, 0.6)) drop-shadow(0 0 6px rgba(217, 70, 239, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.9)) drop-shadow(0 0 12px rgba(217, 70, 239, 0.6)); }
      }
      .pill-base-feat {
        animation: glowPulseFeat 2.5s ease-in-out infinite alternate;
      }
      @keyframes sparkleSpin {
        0% { transform: scale(1) rotate(0deg); opacity: 0.9; }
        50% { transform: scale(1.18) rotate(45deg); opacity: 1; }
        100% { transform: scale(1) rotate(90deg); opacity: 0.9; }
      }
      .star-icon {
        transform-origin: 18px 16px;
        animation: sparkleSpin 4s ease-in-out infinite;
      }
      @keyframes chevronNudgeFeat {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-feat {
        animation: chevronNudgeFeat 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-base-feat">
    <rect x="1.5" y="1.5" width="115" height="29" rx="14.5" fill="url(#bgFeat)" stroke="url(#borderFeat)" stroke-width="1.8" />
  </g>

  <g clip-path="url(#pillClipFeat)">
    <path d="M 58 0 L 88 0 L 118 32 L 88 32 Z" fill="url(#sheenFeat)" />
    <rect x="5" y="2.5" width="108" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: 4-Pointed Sparkle Star (Pink/Magenta) -->
  <g class="star-icon">
    <path d="M 18,8 Q 18,16 23,16 Q 18,16 18,24 Q 18,16 13,16 Q 18,16 18,8 Z" fill="#f472b6" stroke="#fbcfe8" stroke-width="0.5" />
    <circle cx="18" cy="16" r="1.5" fill="#ffffff" />
  </g>

  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Features</text>

  <g class="chev-feat">
    <path d="M 102 12 L 106 16 L 102 20" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
