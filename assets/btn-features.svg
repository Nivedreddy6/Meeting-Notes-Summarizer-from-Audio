<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 46" width="160" height="46">
  <defs>
    <linearGradient id="bgFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14041a" />
      <stop offset="50%" stop-color="#24082e" />
      <stop offset="100%" stop-color="#0e0212" />
    </linearGradient>

    <linearGradient id="glowFeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="sheenFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#f0abfc" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipFeat">
      <rect x="2" y="2" width="156" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseFeat {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(217, 70, 239, 0.5)) drop-shadow(0 0 8px rgba(217, 70, 239, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.9)) drop-shadow(0 0 16px rgba(217, 70, 239, 0.6));
        }
      }
      .pill-container-feat {
        animation: neonPulseFeat 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
    </style>
  </defs>

  <g class="pill-container-feat">
    <rect x="2" y="2" width="156" height="42" rx="21" fill="url(#bgFeat)" stroke="url(#glowFeat)" stroke-width="2.2" />

    <g clip-path="url(#pillClipFeat)">
      <path d="M 85 0 L 130 0 L 165 46 L 120 46 Z" fill="url(#sheenFeat)" />
      <ellipse cx="80" cy="5" rx="70" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <text x="22" y="28" font-size="16" text-anchor="middle">✨</text>
    <text x="78" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Features</text>
    <text x="138" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#f472b6">&gt;</text>
  </g>
</svg>
