<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0c1222" />
    </linearGradient>

    <style>
      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }
      @keyframes eqDance {
        0%, 100% { height: 10px; y: 155px; }
        50% { height: 28px; y: 137px; }
      }
      .anim-dash {
        stroke-dasharray: 6, 6;
        animation: dashMove 1.5s linear infinite;
      }
      .eq-anim-1 { animation: eqDance 1s ease-in-out infinite alternate 0.1s; }
      .eq-anim-2 { animation: eqDance 1s ease-in-out infinite alternate 0.3s; }
      .eq-anim-3 { animation: eqDance 1s ease-in-out infinite alternate 0.5s; }
      .eq-anim-4 { animation: eqDance 1s ease-in-out infinite alternate 0.2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="320" rx="16" fill="url(#pipeBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Section Header -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">SYSTEM PIPELINE &amp; MULTIMODAL FLOW</text>
  <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff">End-to-End Realtime Intelligence Architecture</text>

  <!-- Connecting Arrows with Animated Dashed Line -->
  <!-- Arrow 1 -> 2 -->
  <line x1="275" y1="185" x2="295" y2="185" stroke="#6366f1" stroke-width="2.5" class="anim-dash" />
  <polygon points="295,180 305,185 295,190" fill="#6366f1" />

  <!-- Arrow 2 -> 3 -->
  <line x1="545" y1="185" x2="565" y2="185" stroke="#a855f7" stroke-width="2.5" class="anim-dash" />
  <polygon points="565,180 575,185 565,190" fill="#a855f7" />

  <!-- Arrow 3 -> 4 -->
  <line x1="815" y1="185" x2="835" y2="185" stroke="#10b981" stroke-width="2.5" class="anim-dash" />
  <polygon points="835,180 845,185 835,190" fill="#10b981" />

  <!-- STEP 1: CAPTURE (X=35, Width=240) -->
  <rect x="35" y="95" width="240" height="190" rx="14" fill="#111827" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="65" cy="125" r="14" fill="#0284c7" fill-opacity="0.25" />
  <text x="65" y="130" text-anchor="middle" font-size="14">🎙️</text>
  <text x="90" y="122" font-family="sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">STEP 1: CAPTURE</text>
  <text x="90" y="136" font-family="sans-serif" font-size="11" fill="#94a3b8">Audio Ingestion</text>

  <!-- Live Audio Bars -->
  <rect x="55" y="150" width="5" height="15" rx="2" fill="#38bdf8" class="eq-anim-1" />
  <rect x="65" y="145" width="5" height="20" rx="2" fill="#38bdf8" class="eq-anim-2" />
  <rect x="75" y="152" width="5" height="13" rx="2" fill="#38bdf8" class="eq-anim-3" />
  <rect x="85" y="142" width="5" height="23" rx="2" fill="#38bdf8" class="eq-anim-4" />
  <text x="105" y="156" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Live Mic or Upload</text>
  <text x="105" y="170" font-family="sans-serif" font-size="10" fill="#64748b">MP3, WAV, M4A, WEBM</text>

  <rect x="55" y="195" width="200" height="32" rx="6" fill="#1e293b" fill-opacity="0.7" />
  <text x="65" y="215" font-family="sans-serif" font-size="10" fill="#94a3b8">HTML5 MediaRecorder &amp; Canvas</text>
  <text x="55" y="260" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Dual-Mode Audio Input</text>

  <!-- STEP 2: ENCODE (X=305, Width=240) -->
  <rect x="305" y="95" width="240" height="190" rx="14" fill="#111827" fill-opacity="0.8" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="335" cy="125" r="14" fill="#4338ca" fill-opacity="0.25" />
  <text x="335" y="130" text-anchor="middle" font-size="14">⚡</text>
  <text x="360" y="122" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">STEP 2: ENCODE</text>
  <text x="360" y="136" font-family="sans-serif" font-size="11" fill="#94a3b8">Node.js Streaming</text>

  <rect x="325" y="155" width="200" height="30" rx="6" fill="#1e293b" fill-opacity="0.7" />
  <text x="338" y="174" font-family="monospace" font-size="10" fill="#a5b4fc">base64 chunking</text>

  <rect x="325" y="195" width="200" height="30" rx="6" fill="#1e293b" fill-opacity="0.7" />
  <text x="338" y="214" font-family="monospace" font-size="10" fill="#a5b4fc">JSON Schema Injection</text>

  <text x="325" y="260" font-family="sans-serif" font-size="10" font-weight="600" fill="#818cf8">Zero-Dependency HTTP Server</text>

  <!-- STEP 3: REASON (X=575, Width=240) -->
  <rect x="575" y="95" width="240" height="190" rx="14" fill="#1a122e" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.8" />
  <circle cx="605" cy="125" r="14" fill="#9333ea" fill-opacity="0.25" />
  <text x="605" y="130" text-anchor="middle" font-size="14">🧠</text>
  <text x="630" y="122" font-family="sans-serif" font-size="12" font-weight="700" fill="#f3e8ff">STEP 3: REASON</text>
  <text x="630" y="136" font-family="sans-serif" font-size="11" fill="#e9d5ff">Gemini Multimodal</text>

  <text x="595" y="166" font-family="sans-serif" font-size="10.5" fill="#f5d0fe">• Single-Pass Diarization</text>
  <text x="595" y="184" font-family="sans-serif" font-size="10.5" fill="#f5d0fe">• Acoustic Tone &amp; Sentiment</text>
  <text x="595" y="202" font-family="sans-serif" font-size="10.5" fill="#f5d0fe">• Decisions &amp; Task Assignees</text>
  <text x="595" y="220" font-family="sans-serif" font-size="10.5" fill="#f5d0fe">• Grounded Q&amp;A Embeddings</text>

  <text x="595" y="260" font-family="sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">Gemini 2.5 / 2.0 Flash</text>

  <!-- STEP 4: OUTPUT (X=845, Width=220) -->
  <rect x="845" y="95" width="220" height="190" rx="14" fill="#0d1f1c" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="875" cy="125" r="14" fill="#059669" fill-opacity="0.25" />
  <text x="875" y="130" text-anchor="middle" font-size="14">⚛️</text>
  <text x="900" y="122" font-family="sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">STEP 4: INTERACT</text>
  <text x="900" y="136" font-family="sans-serif" font-size="11" fill="#6ee7b7">React 19 Dashboard</text>

  <rect x="865" y="155" width="180" height="25" rx="5" fill="#064e3b" fill-opacity="0.5" />
  <text x="875" y="171" font-family="sans-serif" font-size="10" fill="#d1fae5">✅ Interactive Task Board</text>

  <rect x="865" y="186" width="180" height="25" rx="5" fill="#064e3b" fill-opacity="0.5" />
  <text x="875" y="202" font-family="sans-serif" font-size="10" fill="#d1fae5">💡 Architecture Decisions Log</text>

  <rect x="865" y="217" width="180" height="25" rx="5" fill="#064e3b" fill-opacity="0.5" />
  <text x="875" y="233" font-family="sans-serif" font-size="10" fill="#d1fae5">💬 AI Meeting Copilot Q&amp;A</text>

  <text x="865" y="260" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399">Markdown / PDF / JSON</text>
</svg>
