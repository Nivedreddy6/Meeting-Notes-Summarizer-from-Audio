<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.6)); }
      }

      @keyframes barDance {
        0%, 100% { height: 12px; }
        50% { height: 38px; }
      }

      .dash-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 1.5s linear infinite;
      }

      .pipeline-node {
        transform-origin: center;
        transition: all 0.3s ease;
      }

      .pulsing-box {
        animation: pulseNode 3s ease-in-out infinite;
      }

      .audio-bar-anim {
        animation: barDance 1s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="360" rx="16" fill="url(#flowBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(40, 40)">
    <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">SYSTEM PIPELINE &amp; MULTIMODAL FLOW</text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff">End-to-End Realtime Intelligence Architecture</text>
  </g>

  <!-- Connecting Animated Dash Lines -->
  <!-- Line 1 to 2 -->
  <path d="M 270 195 L 360 195" fill="none" stroke="#6366f1" stroke-width="2.5" class="dash-line" opacity="0.8" />
  <polygon points="360,190 372,195 360,200" fill="#6366f1" />

  <!-- Line 2 to 3 -->
  <path d="M 590 195 L 680 195" fill="none" stroke="#a855f7" stroke-width="2.5" class="dash-line" opacity="0.8" />
  <polygon points="680,190 692,195 680,200" fill="#a855f7" />

  <!-- Line 3 to 4 -->
  <path d="M 910 195 L 970 195" fill="none" stroke="#10b981" stroke-width="2.5" class="dash-line" opacity="0.8" />
  <polygon points="970,190 982,195 970,200" fill="#10b981" />

  <!-- STEP 1: Audio Inputs -->
  <g transform="translate(50, 110)" class="pipeline-node">
    <rect width="220" height="170" rx="14" fill="#131b2e" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.2" />
    <text x="36" y="41" text-anchor="middle" font-size="16">🎙️</text>
    <text x="62" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#e0f2fe">STEP 1: CAPTURE</text>
    <text x="62" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8">Audio Ingestion</text>

    <!-- Visualizer Animation Graphic -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="5" height="24" rx="2" fill="#38bdf8" class="audio-bar-anim" style="animation-delay: 0.1s;" />
      <rect x="10" y="0" width="5" height="34" rx="2" fill="#38bdf8" class="audio-bar-anim" style="animation-delay: 0.3s;" />
      <rect x="20" y="0" width="5" height="16" rx="2" fill="#38bdf8" class="audio-bar-anim" style="animation-delay: 0.5s;" />
      <rect x="30" y="0" width="5" height="38" rx="2" fill="#38bdf8" class="audio-bar-anim" style="animation-delay: 0.2s;" />
      <rect x="40" y="0" width="5" height="20" rx="2" fill="#38bdf8" class="audio-bar-anim" style="animation-delay: 0.4s;" />
      <text x="60" y="24" font-family="sans-serif" font-size="11" fill="#cbd5e1">Live Mic or Upload</text>
      <text x="60" y="38" font-family="sans-serif" font-size="10" fill="#64748b">MP3, WAV, M4A, WEBM</text>
    </g>

    <text x="24" y="152" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8">HTML5 MediaRecorder &amp; Canvas</text>
  </g>

  <!-- STEP 2: Node.js Streaming Proxy -->
  <g transform="translate(370, 110)" class="pipeline-node">
    <rect width="220" height="170" rx="14" fill="#131b2e" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#4338ca" fill-opacity="0.2" />
    <text x="36" y="41" text-anchor="middle" font-size="16">⚡</text>
    <text x="62" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">STEP 2: ENCODE</text>
    <text x="62" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8">Node.js Streaming</text>

    <g transform="translate(24, 76)">
      <rect width="172" height="28" rx="6" fill="#1e293b" />
      <text x="10" y="18" font-family="monospace" font-size="10" fill="#a5b4fc">base64 chunking</text>
      <rect y="36" width="172" height="28" rx="6" fill="#1e293b" />
      <text x="10" y="54" font-family="monospace" font-size="10" fill="#a5b4fc">JSON Schema Injection</text>
    </g>

    <text x="24" y="152" font-family="sans-serif" font-size="10" font-weight="600" fill="#818cf8">Zero-Dependency HTTP Server</text>
  </g>

  <!-- STEP 3: Gemini Multimodal GenAI Engine -->
  <g transform="translate(690, 110)" class="pipeline-node pulsing-box">
    <rect width="220" height="170" rx="14" fill="#1e1338" fill-opacity="0.9" stroke="#c084fc" stroke-opacity="0.6" stroke-width="2" />
    <circle cx="36" cy="36" r="16" fill="#9333ea" fill-opacity="0.3" />
    <text x="36" y="41" text-anchor="middle" font-size="16">🧠</text>
    <text x="62" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">STEP 3: REASON</text>
    <text x="62" y="48" font-family="sans-serif" font-size="11" fill="#e9d5ff">Gemini Multimodal</text>

    <g transform="translate(24, 74)">
      <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Single-Pass Diarization</text>
      <text x="0" y="28" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Sentiment &amp; Acoustic Tone</text>
      <text x="0" y="44" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Decisions &amp; Task Assignees</text>
      <text x="0" y="60" font-family="sans-serif" font-size="10" fill="#f5d0fe">• Grounded Q&amp;A Embeddings</text>
    </g>

    <text x="24" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">Gemini 2.5 / 2.0 Flash</text>
  </g>

  <!-- STEP 4: React 19 Interactive Dashboard -->
  <g transform="translate(970, 110)" class="pipeline-node">
    <rect width="90" height="170" rx="14" fill="#132320" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="45" y="42" text-anchor="middle" font-size="20">⚛️</text>
    <text x="45" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">REACT 19</text>
    
    <g transform="translate(18, 90)" font-family="sans-serif" font-size="10" fill="#a7f3d0">
      <text y="14">✅ Tasks</text>
      <text y="32">💡 Log</text>
      <text y="50">💬 Chat</text>
      <text y="68">📄 PDF</text>
    </g>
  </g>
</svg>
