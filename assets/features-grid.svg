<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <!-- Card 1: Emerald/Cyan -->
    <linearGradient id="gMic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 2: Violet/Purple -->
    <linearGradient id="gGemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 3: Teal/Emerald -->
    <linearGradient id="gTask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 4: Indigo/Blue -->
    <linearGradient id="gDecision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 5: Fuchsia/Pink -->
    <linearGradient id="gCopilot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 6: Amber/Orange -->
    <linearGradient id="gAudioDeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <style>
      @keyframes neonBorderPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.85; }
      }
      @keyframes eqPulseMini {
        0%, 100% { height: 6px; y: 64px; }
        50% { height: 18px; y: 52px; }
      }
      .card-glow-1 { animation: neonBorderPulse 3s ease-in-out infinite; }
      .card-glow-2 { animation: neonBorderPulse 3s ease-in-out infinite 0.5s; }
      .card-glow-3 { animation: neonBorderPulse 3s ease-in-out infinite 1s; }
      .card-glow-4 { animation: neonBorderPulse 3s ease-in-out infinite 1.5s; }
      .card-glow-5 { animation: neonBorderPulse 3s ease-in-out infinite 2s; }
      .card-glow-6 { animation: neonBorderPulse 3s ease-in-out infinite 2.5s; }
      .eq-mini-1 { animation: eqPulseMini 1s ease-in-out infinite alternate 0.1s; }
      .eq-mini-2 { animation: eqPulseMini 1s ease-in-out infinite alternate 0.3s; }
      .eq-mini-3 { animation: eqPulseMini 1s ease-in-out infinite alternate 0.5s; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="340" rx="16" fill="url(#bgCanvas)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- ================= ROW 1 ================= -->

  <!-- CARD 1: Live Audio Ingest -->
  <rect x="30" y="25" width="295" height="135" rx="12" fill="url(#gMic)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-1" />
  <circle cx="58" cy="55" r="14" fill="#10b981" fill-opacity="0.25" />
  <text x="58" y="61" text-anchor="middle" font-size="14">🎙️</text>
  <text x="82" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Live Mic &amp; Audio Ingest</text>
  <text x="82" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6ee7b7">Browser Web Audio API</text>
  <!-- Mini Equalizer bars -->
  <rect x="270" y="58" width="3" height="12" rx="1" fill="#34d399" class="eq-mini-1" />
  <rect x="276" y="52" width="3" height="18" rx="1" fill="#34d399" class="eq-mini-2" />
  <rect x="282" y="60" width="3" height="10" rx="1" fill="#34d399" class="eq-mini-3" />
  <text x="48" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Realtime microphone frequency visualizer</text>
  <text x="48" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• MP3, WAV, M4A, AAC, OGG, WEBM, FLAC</text>
  <text x="48" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#34d399">⚡ Zero external installation needed</text>

  <!-- CARD 2: Gemini Multimodal AI -->
  <rect x="352" y="25" width="295" height="135" rx="12" fill="url(#gGemini)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-2" />
  <circle cx="380" cy="55" r="14" fill="#9333ea" fill-opacity="0.25" />
  <text x="380" y="61" text-anchor="middle" font-size="14">🧠</text>
  <text x="404" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">Gemini 2.5 Flash GenAI</text>
  <text x="404" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#d8b4fe">Single-Pass Acoustic Reasoning</text>
  <text x="370" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Direct multimodal audio processing</text>
  <text x="370" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Speaker voice diarization &amp; sentiment</text>
  <text x="370" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#c084fc">⚡ 10x faster than Whisper + LLM chains</text>

  <!-- CARD 3: Interactive Action Items -->
  <rect x="674" y="25" width="295" height="135" rx="12" fill="url(#gTask)" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-3" />
  <circle cx="702" cy="55" r="14" fill="#0f766e" fill-opacity="0.25" />
  <text x="702" y="61" text-anchor="middle" font-size="14">✅</text>
  <text x="726" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ccfbf1">Interactive Action Tasks</text>
  <text x="726" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#5eead4">Smart Ownership &amp; Tracking</text>
  <text x="692" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Assignee tags, due dates &amp; priority</text>
  <text x="692" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Dynamic check-off &amp; filter pills</text>
  <text x="692" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#2dd4bf">⚡ Live completion progress tracking</text>

  <!-- ================= ROW 2 ================= -->

  <!-- CARD 4: Consensus Decision Log -->
  <rect x="30" y="180" width="295" height="135" rx="12" fill="url(#gDecision)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-4" />
  <circle cx="58" cy="210" r="14" fill="#4338ca" fill-opacity="0.25" />
  <text x="58" y="216" text-anchor="middle" font-size="14">💡</text>
  <text x="82" y="207" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">Consensus Decision Log</text>
  <text x="82" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#818cf8">Architecture &amp; Strategy ADRs</text>
  <text x="48" y="253" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Structured rationale &amp; context</text>
  <text x="48" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Champion ownership &amp; approval badges</text>
  <text x="48" y="291" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#818cf8">⚡ Never lose critical meeting decisions</text>

  <!-- CARD 5: Meeting AI Copilot -->
  <rect x="352" y="180" width="295" height="135" rx="12" fill="url(#gCopilot)" stroke="#e879f9" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-5" />
  <circle cx="380" cy="210" r="14" fill="#86198f" fill-opacity="0.25" />
  <text x="380" y="216" text-anchor="middle" font-size="14">💬</text>
  <text x="404" y="207" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fae8ff">Ask Meeting AI (Copilot)</text>
  <text x="404" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#f0abfc">Grounded Conversational Q&amp;A</text>
  <text x="370" y="253" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Inquire about numbers, quotes &amp; tasks</text>
  <text x="370" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Full conversational session memory</text>
  <text x="370" y="291" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#e879f9">⚡ Verified answers from audio transcript</text>

  <!-- CARD 6: Audio Deck & Export -->
  <rect x="674" y="180" width="295" height="135" rx="12" fill="url(#gAudioDeck)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" class="card-glow-6" />
  <circle cx="702" cy="210" r="14" fill="#b45309" fill-opacity="0.25" />
  <text x="702" y="216" text-anchor="middle" font-size="14">🎚️</text>
  <text x="726" y="207" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fef3c7">Audio Deck &amp; Multi-Export</text>
  <text x="726" y="223" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#fde68a">Waveform Seek &amp; Export Formats</text>
  <text x="692" y="253" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• Speed toggles (1x, 1.25x, 1.5x, 2x)</text>
  <text x="692" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#cbd5e1">• 1-click Markdown, PDF &amp; JSON export</text>
  <text x="692" y="291" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#f59e0b">⚡ Ready for Notion, Jira, Slack &amp; Teams</text>
</svg>
