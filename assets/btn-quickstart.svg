<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 46" width="165" height="46">
  <defs>
    <linearGradient id="bgQuick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a02" />
      <stop offset="50%" stop-color="#241304" />
      <stop offset="100%" stop-color="#0e0601" />
    </linearGradient>

    <linearGradient id="glowQuick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="sheenQuick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#fdba74" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipQuick">
      <rect x="2" y="2" width="161" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseQuick {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.5)) drop-shadow(0 0 8px rgba(249, 115, 22, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.9)) drop-shadow(0 0 16px rgba(249, 115, 22, 0.6));
        }
      }
      .pill-container-quick {
        animation: neonPulseQuick 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
    </style>
  </defs>

  <g class="pill-container-quick">
    <rect x="2" y="2" width="161" height="42" rx="21" fill="url(#bgQuick)" stroke="url(#glowQuick)" stroke-width="2.2" />

    <g clip-path="url(#pillClipQuick)">
      <path d="M 90 0 L 135 0 L 170 46 L 125 46 Z" fill="url(#sheenQuick)" />
      <ellipse cx="82" cy="5" rx="70" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <text x="22" y="28" font-size="16" text-anchor="middle">⚡</text>
    <text x="82" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Quickstart</text>
    <text x="145" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fb923c">&gt;</text>
  </g>
</svg>
