<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="treeTermBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <!-- Marching Laser Border Gradient -->
    <linearGradient id="treeBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#a855f7" />
      <stop offset="66%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      /* CSS KEYFRAME ANIMATIONS */
      @keyframes laserCycle {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes branchGlow {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.9; }
      }

      .animated-tree-border {
        stroke-dasharray: 100, 30;
        animation: laserCycle 5s linear infinite;
      }
      .cursor-blink {
        animation: blinkCursor 0.8s infinite;
      }
      .branch-line {
        animation: branchGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Terminal Background -->
  <rect width="1000" height="580" rx="16" fill="url(#treeTermBg)" />

  <!-- Animated Marching Perimeter Laser Border -->
  <rect width="1000" height="580" rx="16" fill="none" stroke="url(#treeBorderLaser)" stroke-width="2" class="animated-tree-border" />

  <!-- Top Terminal Window Bar -->
  <rect x="0" y="0" width="1000" height="42" rx="16" fill="#0b1329" fill-opacity="0.95" />
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#eab308" />
  <circle cx="59" cy="21" r="5" fill="#22c55e" />
  <text x="82" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#94a3b8">bash — root@omninote:~$ tree --all --classify</text>
  
  <rect x="780" y="10" width="195" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="877" y="25" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="800" fill="#c7d2fe">● MAIN BRANCH (LIVE)</text>

  <!-- Prompt Command Line -->
  <text x="35" y="68" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">omninote@production:~$ <tspan fill="#f8fafc">tree -L 3 -F</tspan><tspan fill="#38bdf8" class="cursor-blink">_</tspan></text>

  <!-- Central Column Divider Line -->
  <line x1="495" y1="85" x2="495" y2="540" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4, 4" />


