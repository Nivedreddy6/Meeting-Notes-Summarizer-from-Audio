<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <!-- AI Core Reactor Radial Gradient -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1124" />
    </radialGradient>

    <!-- Circuit Wire Gradients -->
    <linearGradient id="wireIngest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="wireAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wireOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <style>
      /* CSS KEYFRAME ANIMATIONS */
      @keyframes dashFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #38bdf8); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 12px #c084fc); }
      }
      @keyframes coreRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 360; }
      }
      @keyframes signalPulse {
        0%, 100% { r: 3.5px; fill-opacity: 0.5; }
        50% { r: 6.5px; fill-opacity: 1; }
      }

      .circuit-line {
        stroke-dasharray: 6, 4;
        animation: dashFlow 1.2s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 5, 3;
        animation: dashFlow 0.8s linear infinite;
      }
      .reactor-ring {
        stroke-dasharray: 18, 6;
        animation: coreRotate 8s linear infinite;
      }
      .signal-dot {
        animation: signalPulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Circuit Board Canvas -->
  <rect width="1000" height="520" rx="16" fill="url(#flowBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Blueprint Circuit Grid Lines -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="65" x2="1000" y2="65" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="295" x2="1000" y2="295" />
    <line x1="0" y1="410" x2="1000" y2="410" />
    <line x1="200" y1="0" x2="200" y2="520" />
    <line x1="380" y1="0" x2="380" y2="520" />
    <line x1="620" y1="0" x2="620" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" />
  </g>

  <!-- Top Title Header -->
  <rect x="0" y="0" width="1000" height="46" rx="16" fill="#0b1329" fill-opacity="0.9" />
  <circle cx="25" cy="23" r="5" fill="#ef4444" />
  <circle cx="42" cy="23" r="5" fill="#eab308" />
  <circle cx="59" cy="23" r="5" fill="#22c55e" />
  <text x="82" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="900" letter-spacing="1.5" fill="#38bdf8">END-TO-END SYSTEM ARCHITECTURE FLOW • SCHEMATIC DIAGRAM</text>
  <rect x="800" y="12" width="175" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="887" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#c7d2fe">● FULL MULTIMODAL MESH</text>


  <!-- ================= CIRCUIT WIRING (Connecting lines behind nodes) ================= -->
  <!-- Audio Input 1 -> Node.js Hub -->
  <path d="M 180 120 L 250 120 L 250 260 L 290 260" fill="none" stroke="url(#wireIngest)" stroke-width="2.5" class="circuit-line" />
  <!-- Audio Input 2 -> Node.js Hub -->
  <path d="M 180 260 L 290 260" fill="none" stroke="url(#wireIngest)" stroke-width="2.5" class="circuit-line" />
  <!-- Audio Input 3 -> Node.js Hub -->
  <path d="M 180 400 L 250 400 L 250 260 L 290 260" fill="none" stroke="url(#wireIngest)" stroke-width="2.5" class="circuit-line" />

  <!-- Node.js Hub -> AI Core Reactor -->
  <path d="M 430 260 L 490 260" fill="none" stroke="url(#wireAI)" stroke-width="3" class="circuit-line-fast" />

  <!-- AI Core Reactor -> Output 1: Action Items -->
  <path d="M 640 240 L 710 240 L 710 110 L 760 110" fill="none" stroke="url(#wireOut)" stroke-width="2.2" class="circuit-line" />
  <!-- AI Core Reactor -> Output 2: Decision ADRs -->
  <path d="M 640 250 L 730 250 L 730 185 L 760 185" fill="none" stroke="url(#wireOut)" stroke-width="2.2" class="circuit-line" />
  <!-- AI Core Reactor -> Output 3: Grounded Copilot -->
  <path d="M 640 260 L 760 260" fill="none" stroke="url(#wireOut)" stroke-width="2.5" class="circuit-line-fast" />
  <!-- AI Core Reactor -> Output 4: Topics Timeline -->
  <path d="M 640 270 L 730 270 L 730 335 L 760 335" fill="none" stroke="url(#wireOut)" stroke-width="2.2" class="circuit-line" />
  <!-- AI Core Reactor -> Output 5: Universal Export -->
  <path d="M 640 280 L 710 280 L 710 410 L 760 410" fill="none" stroke="url(#wireOut)" stroke-width="2.2" class="circuit-line" />


  <!-- ================= STAGE 1: INPUT INGESTION NODES (Left Column) ================= -->

  <!-- Node 1: Live Mic Stream (Circle/Hex style) -->
  <g transform="translate(25, 75)">
    <rect width="155" height="90" rx="14" fill="#062e24" stroke="#10b981" stroke-width="1.8" />
    <circle cx="32" cy="30" r="14" fill="#047857" />
    <text x="32" y="35" text-anchor="middle" font-size="14">🎙️</text>
    <text x="56" y="27" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#a7f3d0">Live Mic</text>
    <text x="56" y="42" font-family="sans-serif" font-size="9" font-weight="600" fill="#34d399">Web Audio API</text>
    <text x="18" y="65" font-family="sans-serif" font-size="9" fill="#cbd5e1">• 16kHz PCM stream</text>
    <text x="18" y="78" font-family="sans-serif" font-size="9" fill="#cbd5e1">• 60fps Canvas spectrum</text>
  </g>

  <!-- Node 2: File Upload Ingest -->
  <g transform="translate(25, 215)">
    <rect width="155" height="90" rx="14" fill="#0c1e28" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="32" cy="30" r="14" fill="#0284c7" />
    <text x="32" y="35" text-anchor="middle" font-size="14">📁</text>
    <text x="56" y="27" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#bae6fd">File Ingest</text>
    <text x="56" y="42" font-family="sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Audio Decoder</text>
    <text x="18" y="65" font-family="sans-serif" font-size="9" fill="#cbd5e1">• MP3, WAV, M4A, AAC</text>
    <text x="18" y="78" font-family="sans-serif" font-size="9" fill="#cbd5e1">• Base64 memory chunker</text>
  </g>

  <!-- Node 3: Demo Switcher -->
  <g transform="translate(25, 355)">
    <rect width="155" height="90" rx="14" fill="#1e182e" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="32" cy="30" r="14" fill="#7e22ce" />
    <text x="32" y="35" text-anchor="middle" font-size="14">⚡</text>
    <text x="56" y="27" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#f3e8ff">Demo Cache</text>
    <text x="56" y="42" font-family="sans-serif" font-size="9" font-weight="600" fill="#c084fc">Instant Demos</text>
    <text x="18" y="65" font-family="sans-serif" font-size="9" fill="#cbd5e1">• Sprint 42 Tech Sync</text>
    <text x="18" y="78" font-family="sans-serif" font-size="9" fill="#cbd5e1">• 1-second instant run</text>
  </g>


  <!-- ================= STAGE 2: NODE.JS STREAMING HUB & ROUTER (Middle Left) ================= -->
  <g transform="translate(290, 180)">
    <!-- Main Gateway Box -->
    <rect width="140" height="160" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <!-- Top Gateway Tab -->
    <rect x="15" y="-12" width="110" height="22" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="1" />
    <text x="70" y="3" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">STREAM HUB</text>

    <circle cx="70" cy="38" r="16" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
    <text x="70" y="44" text-anchor="middle" font-size="15">⚡</text>
    <text x="70" y="70" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#c7d2fe">server.js</text>
    <text x="70" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero-Dependency</text>

    <!-- Schema & Privacy Badges inside Hub -->
    <rect x="12" y="98" width="116" height="22" rx="4" fill="#1e1b4b" />
    <text x="70" y="113" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#a5b4fc">Schema Injector</text>

    <rect x="12" y="126" width="116" height="22" rx="4" fill="#064e3b" />
    <text x="70" y="141" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#6ee7b7">🔒 In-Memory Only</text>
  </g>


  <!-- ================= STAGE 3: THE NEURAL CORE (Center Centerpiece) ================= -->
  <g transform="translate(565, 260)">
    <!-- Outer Pulsing Glow Orbit -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#818cf8" stroke-width="2" class="reactor-ring" />
    <circle cx="0" cy="0" r="70" fill="url(#reactorGlow)" stroke="#c084fc" stroke-width="2.5" />

    <!-- Pulsing Signal Satellites on Orbit -->
    <circle cx="0" cy="-82" r="5" fill="#38bdf8" class="signal-dot" />
    <circle cx="82" cy="0" r="5" fill="#a855f7" class="signal-dot" />
    <circle cx="0" cy="82" r="5" fill="#10b981" class="signal-dot" />
    <circle cx="-82" cy="0" r="5" fill="#f59e0b" class="signal-dot" />

    <!-- Center Neural Icon & Text -->
    <text x="0" y="-22" text-anchor="middle" font-size="28">🧠</text>
    <text x="0" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#ffffff">GEMINI 2.5</text>
    <text x="0" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#e9d5ff">FLASH MULTIMODAL</text>
    <rect x="-48" y="24" width="96" height="16" rx="4" fill="#581c87" />
    <text x="0" y="35" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8">&lt; 7.3s SINGLE PASS</text>
  </g>


  <!-- ================= STAGE 4: OUTPUT WORKSPACE DECK (Right Column) ================= -->

  <!-- Output 1: Action Items Board -->
  <g transform="translate(760, 80)">
    <rect width="215" height="58" rx="10" fill="#0c1b2a" stroke="#2dd4bf" stroke-width="1.5" />
    <circle cx="24" cy="29" r="12" fill="#0f766e" />
    <text x="24" y="34" text-anchor="middle" font-size="12">✅</text>
    <text x="44" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#ccfbf1">Action Items Board</text>
    <text x="44" y="40" font-family="sans-serif" font-size="9" fill="#94a3b8">Assignees, priority pills, due dates</text>
  </g>

  <!-- Output 2: Decision ADR Log -->
  <g transform="translate(760, 155)">
    <rect width="215" height="58" rx="10" fill="#0c1b2a" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="24" cy="29" r="12" fill="#312e81" />
    <text x="24" y="34" text-anchor="middle" font-size="12">💡</text>
    <text x="44" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">Consensus Decision ADR</text>
    <text x="44" y="40" font-family="sans-serif" font-size="9" fill="#94a3b8">Problem context, champions, rationales</text>
  </g>

  <!-- Output 3: Grounded AI Copilot -->
  <g transform="translate(760, 230)">
    <rect width="215" height="58" rx="10" fill="#1b102b" stroke="#e879f9" stroke-width="1.8" />
    <circle cx="24" cy="29" r="12" fill="#701a75" />
    <text x="24" y="34" text-anchor="middle" font-size="12">💬</text>
    <text x="44" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fae8ff">Grounded Copilot AI</text>
    <text x="44" y="40" font-family="sans-serif" font-size="9" fill="#f0abfc">Conversational verbatim Q&amp;A</text>
  </g>

  <!-- Output 4: Topics & Timeline -->
  <g transform="translate(760, 305)">
    <rect width="215" height="58" rx="10" fill="#0c1b2a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="29" r="12" fill="#0369a1" />
    <text x="24" y="34" text-anchor="middle" font-size="12">📊</text>
    <text x="44" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#bae6fd">Agenda &amp; Timeline</text>
    <text x="44" y="40" font-family="sans-serif" font-size="9" fill="#94a3b8">Topic breakdown &amp; duration markers</text>
  </g>

  <!-- Output 5: Universal Multi-Export -->
  <g transform="translate(760, 380)">
    <rect width="215" height="58" rx="10" fill="#201a08" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="24" cy="29" r="12" fill="#78350f" />
    <text x="24" y="34" text-anchor="middle" font-size="12">📥</text>
    <text x="44" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fef3c7">Universal Multi-Export</text>
    <text x="44" y="40" font-family="sans-serif" font-size="9" fill="#fde68a">1-Click Markdown, PDF &amp; JSON</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="25" y="475" width="950" height="30" rx="8" fill="#0b1329" />
  <circle cx="45" cy="490" r="4" fill="#10b981" />
  <text x="56" y="494" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">Layer 1: Audio Ingestion</text>
  <line x1="185" y1="482" x2="185" y2="498" stroke="#334155" stroke-width="1" />

  <circle cx="205" cy="490" r="4" fill="#818cf8" />
  <text x="216" y="494" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">Layer 2: Zero-Dependency Streaming Proxy</text>
  <line x1="435" y1="482" x2="435" y2="498" stroke="#334155" stroke-width="1" />

  <circle cx="455" cy="490" r="4" fill="#c084fc" />
  <text x="466" y="494" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">Layer 3: Gemini 2.5 Flash Neural Engine</text>
  <line x1="685" y1="482" x2="685" y2="498" stroke="#334155" stroke-width="1" />

  <circle cx="705" cy="490" r="4" fill="#f59e0b" />
  <text x="716" y="494" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8">Layer 4: React 19 Workspace Outputs</text>
</svg>
