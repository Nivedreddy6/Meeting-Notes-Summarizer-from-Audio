<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Layer Gradients -->
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c2d3a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.4" />
    </linearGradient>

    <style>
      @keyframes dataStream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes pulseChip {
        0%, 100% { fill-opacity: 0.6; r: 4px; }
        50% { fill-opacity: 1; r: 6px; }
      }
      @keyframes glowFrame {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.85; }
      }
      .data-bus {
        stroke-dasharray: 8, 4;
        animation: dataStream 1.5s linear infinite;
      }
      .data-bus-fast {
        stroke-dasharray: 6, 3;
        animation: dataStream 0.9s linear infinite;
      }
      .chip-pulse { animation: pulseChip 2s ease-in-out infinite; }
      .layer-frame { animation: glowFrame 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Blueprint Background -->
  <rect width="1000" height="480" rx="16" fill="url(#archBg)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Blueprint Coordinate Grid Lines -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="165" x2="1000" y2="165" />
    <line x1="0" y1="270" x2="1000" y2="270" />
    <line x1="0" y1="375" x2="1000" y2="375" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
  </g>

  <!-- Top Architecture Header Bar -->
  <rect x="0" y="0" width="1000" height="42" rx="16" fill="#0b1329" fill-opacity="0.9" />
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#eab308" />
  <circle cx="59" cy="21" r="5" fill="#22c55e" />
  <text x="82" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#38bdf8">SYSTEM ARCHITECTURE BLUEPRINT • END-TO-END DATA FLOW</text>
  <rect x="830" y="11" width="145" height="20" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="902" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#c7d2fe">● FULL MULTIMODAL STACK</text>

  <!-- ================= TIER 1: AUDIO CAPTURE & INGESTION LAYER ================= -->
  <rect x="25" y="60" width="215" height="395" rx="12" fill="url(#tier1Grad)" stroke="#10b981" stroke-width="1.5" class="layer-frame" />
  <rect x="35" y="70" width="195" height="26" rx="6" fill="#064e3b" />
  <text x="132" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">LAYER 1: AUDIO INGEST</text>

  <!-- Node 1.1: Live Mic Stream -->
  <rect x="40" y="110" width="185" height="85" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
  <text x="52" y="132" font-family="sans-serif" font-size="11" font-weight="800" fill="#5eead4">🎙️ Live Microphone</text>
  <text x="52" y="150" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• HTML5 MediaRecorder API</text>
  <text x="52" y="166" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• 16kHz PCM audio stream</text>
  <text x="52" y="182" font-family="sans-serif" font-size="9.5" fill="#2dd4bf">• 60 FPS Canvas visualizer</text>

  <!-- Node 1.2: File Upload Engine -->
  <rect x="40" y="210" width="185" height="85" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
  <text x="52" y="232" font-family="sans-serif" font-size="11" font-weight="800" fill="#5eead4">📁 Multi-Format Ingest</text>
  <text x="52" y="250" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• MP3, WAV, M4A, AAC, WEBM</text>
  <text x="52" y="266" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Client-side Base64 chunker</text>
  <text x="52" y="282" font-family="sans-serif" font-size="9.5" fill="#2dd4bf">• Zero size restriction up to 200MB</text>

  <!-- Node 1.3: Preloaded Demo Cache -->
  <rect x="40" y="310" width="185" height="85" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
  <text x="52" y="332" font-family="sans-serif" font-size="11" font-weight="800" fill="#5eead4">⚡ Instant Demo Cache</text>
  <text x="52" y="350" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Sprint 42 Tech Sync</text>
  <text x="52" y="366" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Q4 Executive Brief</text>
  <text x="52" y="382" font-family="sans-serif" font-size="9.5" fill="#2dd4bf">• 1-click test without upload</text>

  <rect x="40" y="410" width="185" height="28" rx="6" fill="#0f766e" />
  <text x="132" y="428" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Raw Audio Chunks Buffer</text>

  <!-- Data Flow Arrow 1 -> 2 -->
  <line x1="240" y1="250" x2="270" y2="250" stroke="#10b981" stroke-width="3" class="data-bus" />
  <polygon points="270,245 280,250 270,255" fill="#10b981" />

  <!-- ================= TIER 2: NODE.JS STREAMING PROXY ================= -->
  <rect x="280" y="60" width="205" height="395" rx="12" fill="url(#tier2Grad)" stroke="#818cf8" stroke-width="1.5" class="layer-frame" />
  <rect x="290" y="70" width="185" height="26" rx="6" fill="#312e81" />
  <text x="382" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">LAYER 2: STREAMING PROXY</text>

  <!-- Node 2.1: Zero-Dependency Server -->
  <rect x="295" y="110" width="175" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="307" y="132" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">⚡ Node.js Server</text>
  <text x="307" y="150" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Zero external dependencies</text>
  <text x="307" y="166" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Built-in http &amp; fs modules</text>
  <text x="307" y="182" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Native fetch API proxying</text>
  <text x="307" y="196" font-family="sans-serif" font-size="9" font-weight="700" fill="#818cf8">Runs on Port :3000</text>

  <!-- Node 2.2: Schema Injection Engine -->
  <rect x="295" y="220" width="175" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="307" y="242" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">🎯 Archetype Engine</text>
  <text x="307" y="260" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• 5 Tailored System Personas</text>
  <text x="307" y="276" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Strict JSON schema injection</text>
  <text x="307" y="292" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Enforces typed output bounds</text>
  <text x="307" y="306" font-family="sans-serif" font-size="9" font-weight="700" fill="#818cf8">Guaranteed Valid JSON</text>

  <!-- Node 2.3: In-Memory Privacy -->
  <rect x="295" y="330" width="175" height="105" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
  <text x="307" y="352" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">🔒 Client Privacy Guard</text>
  <text x="307" y="370" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• 100% In-memory stream</text>
  <text x="307" y="386" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Zero temp files written to disk</text>
  <text x="307" y="402" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• API Key stored in browser only</text>
  <text x="307" y="422" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399">✓ Zero Data Retention</text>

  <!-- Data Flow Arrow 2 -> 3 -->
  <line x1="485" y1="250" x2="515" y2="250" stroke="#818cf8" stroke-width="3" class="data-bus-fast" />
  <polygon points="515,245 525,250 515,255" fill="#818cf8" />

  <!-- ================= TIER 3: GEMINI 2.5 FLASH MULTIMODAL CORE ================= -->
  <rect x="525" y="60" width="215" height="395" rx="12" fill="url(#tier3Grad)" stroke="#c084fc" stroke-width="1.8" class="layer-frame" />
  <rect x="535" y="70" width="195" height="26" rx="6" fill="#581c87" />
  <text x="632" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#f3e8ff">LAYER 3: MULTIMODAL CORE</text>

  <!-- Node 3.1: Direct Audio Tokenizer -->
  <rect x="540" y="110" width="185" height="85" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="552" y="132" font-family="sans-serif" font-size="11" font-weight="800" fill="#f0abfc">🧠 Gemini 2.5 Flash</text>
  <text x="552" y="150" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Native audio tokenization</text>
  <text x="552" y="166" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Single multimodal API pass</text>
  <text x="552" y="182" font-family="sans-serif" font-size="9" font-weight="700" fill="#c084fc">⚡ &lt;3s Tokenization</text>

  <!-- Node 3.2: Acoustic Diarization -->
  <rect x="540" y="210" width="185" height="85" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="552" y="232" font-family="sans-serif" font-size="11" font-weight="800" fill="#f0abfc">👥 Voice Diarization</text>
  <text x="552" y="250" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Timbre, pitch &amp; cadence analysis</text>
  <text x="552" y="266" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Speaker separation (Marcus, Elena...)</text>
  <text x="552" y="282" font-family="sans-serif" font-size="9" font-weight="700" fill="#c084fc">Timestamp-accurate dialog</text>

  <!-- Node 3.3: Structured Reasoning Engine -->
  <rect x="540" y="310" width="185" height="125" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="552" y="332" font-family="sans-serif" font-size="11" font-weight="800" fill="#f0abfc">💡 Structured Reasoning</text>
  <text x="552" y="350" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Executive Summary TL;DR</text>
  <text x="552" y="366" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Action item assignees &amp; due dates</text>
  <text x="552" y="382" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Consensus Decision ADR records</text>
  <text x="552" y="398" font-family="sans-serif" font-size="9.5" fill="#f3e8ff">• Questions &amp; unresolved risks</text>
  <text x="552" y="420" font-family="sans-serif" font-size="9" font-weight="800" fill="#a7f3d0">✓ &lt;7.3s Total Latency Turnaround</text>

  <!-- Data Flow Arrow 3 -> 4 -->
  <line x1="740" y1="250" x2="770" y2="250" stroke="#c084fc" stroke-width="3" class="data-bus" />
  <polygon points="770,245 780,250 770,255" fill="#c084fc" />

  <!-- ================= TIER 4: REACT 19 WORKSPACE & CLIENT SUITE ================= -->
  <rect x="780" y="60" width="195" height="395" rx="12" fill="url(#tier4Grad)" stroke="#38bdf8" stroke-width="1.5" class="layer-frame" />
  <rect x="790" y="70" width="175" height="26" rx="6" fill="#0369a1" />
  <text x="877" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#bae6fd">LAYER 4: REACT 19 DECK</text>

  <!-- Node 4.1: Action Items Board -->
  <rect x="790" y="110" width="175" height="70" rx="8" fill="#0c1b2a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="802" y="130" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#bae6fd">✅ Action Items Board</text>
  <text x="802" y="148" font-family="sans-serif" font-size="9" fill="#cbd5e1">Interactive checklist &amp; filters</text>
  <text x="802" y="164" font-family="sans-serif" font-size="9" fill="#38bdf8">Live completion progress bar</text>

  <!-- Node 4.2: Decision ADRs -->
  <rect x="790" y="190" width="175" height="70" rx="8" fill="#0c1b2a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="802" y="210" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#bae6fd">💡 Decision ADR Log</text>
  <text x="802" y="228" font-family="sans-serif" font-size="9" fill="#cbd5e1">Consensus rationales &amp; champions</text>
  <text x="802" y="244" font-family="sans-serif" font-size="9" fill="#38bdf8">Governance audit trails</text>

  <!-- Node 4.3: Grounded AI Copilot -->
  <rect x="790" y="270" width="175" height="75" rx="8" fill="#0c1b2a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="802" y="290" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#bae6fd">💬 Grounded Copilot</text>
  <text x="802" y="308" font-family="sans-serif" font-size="9" fill="#cbd5e1">Conversational meeting Q&amp;A</text>
  <text x="802" y="324" font-family="sans-serif" font-size="9" fill="#cbd5e1">Verbatim citations from audio</text>
  <text x="802" y="338" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#c084fc">Chat Context Memory</text>

  <!-- Node 4.4: Universal Exporter -->
  <rect x="790" y="355" width="175" height="80" rx="8" fill="#0c1b2a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="802" y="375" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#bae6fd">📄 Universal Export</text>
  <text x="802" y="393" font-family="sans-serif" font-size="9" fill="#cbd5e1">1-Click Markdown (.md)</text>
  <text x="802" y="409" font-family="sans-serif" font-size="9" fill="#cbd5e1">Styled Print-Ready PDF</text>
  <text x="802" y="425" font-family="sans-serif" font-size="9" font-weight="700" fill="#a7f3d0">Raw JSON for Notion &amp; Jira</text>
</svg>
