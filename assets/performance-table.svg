<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="100%">
  <defs>
    <linearGradient id="perfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1326" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <style>
      @keyframes barGrow {
        0% { width: 40px; }
        50% { width: 280px; }
        100% { width: 280px; }
      }
      @keyframes slowBar {
        0% { width: 20px; }
        50% { width: 90px; }
        100% { width: 90px; }
      }
      @keyframes winGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; }
      }
      .anim-bar-win { animation: barGrow 3s ease-out infinite; }
      .anim-bar-slow { animation: slowBar 3s ease-out infinite; }
      .table-laser { animation: winGlow 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="290" rx="16" fill="url(#perfBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Table Title Bar -->
  <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#38bdf8">PERFORMANCE BENCHMARKS &amp; LATENCY</text>
  <text x="35" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Gemini 2.5 Flash Multimodal vs Legacy Whisper Chains</text>

  <!-- Winner Trophy Badge -->
  <rect x="740" y="24" width="225" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.2" class="table-laser" />
  <text x="852" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7">⚡ 85% LATENCY REDUCTION</text>

  <!-- Table Header -->
  <rect x="25" y="68" width="950" height="32" rx="6" fill="#1e293b" fill-opacity="0.8" />
  <text x="45" y="89" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#94a3b8">PIPELINE STAGE</text>
  <text x="310" y="89" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#f87171">LEGACY WHISPER + LLM CHAIN</text>
  <text x="590" y="89" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#34d399">OMNINOTE AI (GEMINI 2.5)</text>
  <text x="870" y="89" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8">SPEEDUP</text>

  <!-- Row 1: Ingestion & Transcription -->
  <rect x="25" y="104" width="950" height="38" rx="6" fill="#0f172a" fill-opacity="0.6" />
  <text x="45" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">🎙️ Speech Ingestion</text>
  <text x="310" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Whisper STT: <tspan fill="#f87171" font-weight="700">~25.0s</tspan></text>
  <text x="590" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e2e8f0">Direct Audio Tokenization: <tspan fill="#34d399" font-weight="800">&lt; 2.8s</tspan></text>
  <rect x="865" y="112" width="90" height="22" rx="4" fill="#065f46" />
  <text x="910" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7">8.9x Faster</text>

  <!-- Row 2: Reasoning & Extraction -->
  <rect x="25" y="146" width="950" height="38" rx="6" fill="#0f172a" fill-opacity="0.9" />
  <text x="45" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">🧠 Structured Reasoning</text>
  <text x="310" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Separate LLM Chaining: <tspan fill="#f87171" font-weight="700">~20.0s</tspan></text>
  <text x="590" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e2e8f0">Single-Pass JSON Extraction: <tspan fill="#34d399" font-weight="800">&lt; 4.5s</tspan></text>
  <rect x="865" y="154" width="90" height="22" rx="4" fill="#065f46" />
  <text x="910" y="169" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7">4.4x Faster</text>

  <!-- Row 3: Total End-to-End Latency (Featured Animated Row) -->
  <rect x="25" y="188" width="950" height="48" rx="6" fill="#132438" stroke="#38bdf8" stroke-width="1.5" class="table-laser" />
  <text x="45" y="217" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ffffff">⚡ Total Turnaround</text>
  <text x="310" y="217" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">45.0s – 60.0s (Slow)</text>
  <rect x="590" y="202" width="230" height="20" rx="10" fill="#1e293b" />
  <rect x="590" y="202" width="220" height="20" rx="10" fill="url(#winGrad)" class="anim-bar-win" />
  <text x="700" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#060913">&lt; 7.3s Instant</text>
  <rect x="865" y="201" width="90" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="910" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#c7d2fe">Instantaneous</text>

  <!-- Row 4: Speaker Diarization & Privacy -->
  <rect x="25" y="240" width="950" height="38" rx="6" fill="#0f172a" fill-opacity="0.6" />
  <text x="45" y="264" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">🔒 Diarization &amp; Privacy</text>
  <text x="310" y="264" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">External PyAnnote + Disk temp files</text>
  <text x="590" y="264" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e2e8f0">Native voice timbre + <tspan fill="#34d399" font-weight="700">100% In-Memory Privacy</tspan></text>
  <rect x="865" y="248" width="90" height="22" rx="4" fill="#065f46" />
  <text x="910" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7">Zero Disk</text>
</svg>
