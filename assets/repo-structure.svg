  <rect x="35" y="65" width="260" height="26" rx="5" fill="#0369a1" />
  <text x="165" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">⚛️ SRC ROOT &amp; STATE ENGINE</text>

