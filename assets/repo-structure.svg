<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="repoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091222" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <style>
      @keyframes repoBorderDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      .repo-laser {
        stroke-dasharray: 80, 25;
        animation: repoBorderDash 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Blueprint Background -->
  <rect width="1000" height="480" rx="16" fill="url(#repoBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />
  <rect width="1000" height="480" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.6" class="repo-laser" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="1000" height="40" rx="16" fill="#0f172a" fill-opacity="0.95" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#eab308" />
  <circle cx="59" cy="20" r="5" fill="#22c55e" />
  <text x="82" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">REPOSITORY DIRECTORY STRUCTURE &amp; ARCHITECTURE MAP</text>
  <rect x="800" y="10" width="175" height="20" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
