    <linearGradient id="toolsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <style>
      @keyframes toolsLaser {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -180; }
      }
      .laser-col {
        stroke-dasharray: 60, 20;
        animation: toolsLaser 3.5s linear infinite;
      }
    </style>
