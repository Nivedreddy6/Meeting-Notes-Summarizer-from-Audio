<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 40" width="134" height="40">
  <defs>
    <linearGradient id="bgWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a18" />
      <stop offset="50%" stop-color="#121530" />
      <stop offset="100%" stop-color="#060712" />
    </linearGradient>

    <linearGradient id="borderWork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="glowRingWork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="sheenWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipWork">
      <rect x="4" y="4" width="126" height="32" rx="16" />
    </clipPath>

    <style>
      @keyframes neonBreatheWork {
        0%, 100% { opacity: 0.35; stroke-width: 2.5; }
        50% { opacity: 0.75; stroke-width: 3.5; }
      }
      .glow-halo-work {
        animation: neonBreatheWork 2.2s ease-in-out infinite alternate;
      }
      @keyframes bubbleFloat1 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-7px); opacity: 0; }
      }
      @keyframes bubbleFloat2 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-8px); opacity: 0; }
      }
      .bub-1 { animation: bubbleFloat1 1.5s ease-in infinite; }
      .bub-2 { animation: bubbleFloat2 1.8s ease-in infinite 0.6s; }

      @keyframes chevronNudgeWork {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-work {
        animation: chevronNudgeWork 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 100% ROUND OUTER GLOW AURA (Zero square edges, pure pill shape with transparent padding) -->
  <rect class="glow-halo-work" x="2.5" y="2.5" width="129" height="35" rx="17.5" fill="none" stroke="url(#glowRingWork)" stroke-width="2.5" />

  <!-- Main Round Pill Capsule Base -->
  <rect x="4" y="4" width="126" height="32" rx="16" fill="url(#bgWork)" stroke="url(#borderWork)" stroke-width="1.8" />

  <!-- Diagonal Specular Glass Reflection (Clipped to Pill) -->
  <g clip-path="url(#pillClipWork)">
    <path d="M 68 4 L 100 4 L 130 36 L 100 36 Z" fill="url(#sheenWork)" />
    <rect x="9" y="6.5" width="116" height="12" rx="6" fill="#ffffff" opacity="0.09" />
  </g>

  <!-- SVG Vector Icon: Chemistry Flask with Rising Bubbles -->
  <g transform="translate(4, 4)">
    <path d="M 16,8 L 20,8 L 20,12 L 23.5,21.5 A 1.8 1.8 0 0 1 21.8,24 L 14.2,24 A 1.8 1.8 0 0 1 12.5,21.5 L 16,12 Z" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M 13.8,21.5 L 15,18 L 21,18 L 22.2,21.5 A 1 1 0 0 1 21.3,22.5 L 14.7,22.5 A 1 1 0 0 1 13.8,21.5 Z" fill="#6366f1" opacity="0.65" />
    <circle class="bub-1" cx="16.5" cy="19.5" r="1.1" fill="#c7d2fe" />
    <circle class="bub-2" cx="19" cy="20.5" r="1.3" fill="#ffffff" />
  </g>

  <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Workspace</text>

  <g class="chev-work">
    <path d="M 114 16 L 118 20 L 114 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
