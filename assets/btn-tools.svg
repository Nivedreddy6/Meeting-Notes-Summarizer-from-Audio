<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 46" width="190" height="46">
  <defs>
    <!-- Dark Capsule Background -->
    <linearGradient id="bgTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140e" />
      <stop offset="50%" stop-color="#082319" />
      <stop offset="100%" stop-color="#040e0a" />
    </linearGradient>

    <!-- Emerald Border Glow Gradient -->
    <linearGradient id="glowTools" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass Specular Reflection Sheen Gradient -->
    <linearGradient id="sheenTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Clip Path for Pill Shape -->
    <clipPath id="pillClipTools">
      <rect x="2" y="2" width="186" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseTools {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.5)) drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.9)) drop-shadow(0 0 16px rgba(16, 185, 129, 0.6));
        }
      }
      .pill-container-tools {
        animation: neonPulseTools 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
      @keyframes sheenSweep {
        0% { transform: translateX(-60px); }
        100% { transform: translateX(80px); }
      }
      .sheen-layer {
        animation: sheenSweep 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-container-tools">
    <!-- Outer Pill Base with Glowing Neon Stroke -->
    <rect x="2" y="2" width="186" height="42" rx="21" fill="url(#bgTools)" stroke="url(#glowTools)" stroke-width="2.2" />

    <!-- Glass Specular Highlight Sheen (Clipped to Pill) -->
    <g clip-path="url(#pillClipTools)">
      <!-- Diagonal Specular Highlight Crescent (as in screenshot) -->
      <path d="M 105 0 L 155 0 L 195 46 L 145 46 Z" fill="url(#sheenTools)" />
      <!-- Subtle Top Rim Highlight -->
      <ellipse cx="95" cy="5" rx="80" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <!-- Left Icon -->
    <text x="22" y="28" font-size="16" text-anchor="middle">🛠️</text>

    <!-- Button Text -->
    <text x="96" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Tools &amp; Tech</text>

    <!-- Right Chevron Arrow -->
    <text x="168" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#34d399">&gt;</text>
  </g>
</svg>
