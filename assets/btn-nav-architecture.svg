<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 32" width="146" height="32">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14" />
      <stop offset="50%" stop-color="#091424" />
      <stop offset="100%" stop-color="#03070f" />
    </linearGradient>

    <linearGradient id="borderArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sheenArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipArch">
      <rect x="1.5" y="1.5" width="143" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseArch {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(0, 210, 255, 0.6)) drop-shadow(0 0 6px rgba(0, 210, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 12px rgba(0, 210, 255, 0.6)); }
      }
      .pill-base-arch {
        animation: glowPulseArch 2.5s ease-in-out infinite alternate;
      }
      @keyframes floatStack {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      .stack-icon {
        animation: floatStack 2.2s ease-in-out infinite;
      }
      @keyframes chevronNudgeArch {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-arch {
        animation: chevronNudgeArch 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-base-arch">
    <rect x="1.5" y="1.5" width="143" height="29" rx="14.5" fill="url(#bgArch)" stroke="url(#borderArch)" stroke-width="1.8" />
  </g>

  <g clip-path="url(#pillClipArch)">
    <path d="M 78 0 L 112 0 L 146 32 L 112 32 Z" fill="url(#sheenArch)" />
    <rect x="5" y="2.5" width="136" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: 3D Isometric Stacked Layers (Cyan) -->
  <g class="stack-icon">
    <!-- Bottom layer -->
    <polygon points="18,17 23,20 18,23 13,20" fill="#0369a1" opacity="0.7" />
    <!-- Middle layer -->
    <polygon points="18,13 23,16 18,19 13,16" fill="#0284c7" opacity="0.85" />
    <!-- Top layer -->
    <polygon points="18,9 23,12 18,15 13,12" fill="#38bdf8" stroke="#7dd3fc" stroke-width="0.6" />
  </g>

  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Architecture</text>

  <g class="chev-arch">
    <path d="M 130 12 L 134 16 L 130 20" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
