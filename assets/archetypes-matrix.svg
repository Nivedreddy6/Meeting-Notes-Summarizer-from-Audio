<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <style>
      @keyframes archLaser {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }
      .laser-arch {
        stroke-dasharray: 60, 20;
        animation: archLaser 3.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="250" rx="16" fill="url(#matrixCanvasBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Section Title -->
  <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#38bdf8">SPECIALIZED AI PERSONAS</text>
  <text x="35" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="900" fill="#ffffff">5 Tailored Meeting Extraction Archetypes</text>
  <rect x="740" y="24" width="225" height="28" rx="14" fill="#132438" stroke="#38bdf8" stroke-width="1.2" />
  <text x="852" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">⚡ SELECTABLE PROMPT SCHEMAS</text>

  <!-- CARD 1: Comprehensive Minutes (X=25) -->
  <rect x="25" y="75" width="180" height="155" rx="12" fill="#131b2e" fill-opacity="0.95" />
  <rect x="25" y="75" width="180" height="155" rx="12" fill="none" stroke="#6366f1" stroke-width="1.8" class="laser-arch" />
  <circle cx="52" cy="104" r="14" fill="#4338ca" fill-opacity="0.4" />
  <text x="52" y="109" text-anchor="middle" font-size="13">📝</text>
  <text x="74" y="102" font-family="sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">Full Minutes</text>
  <text x="74" y="117" font-family="sans-serif" font-size="9" font-weight="600" fill="#818cf8">Balanced Scribe</text>
  <text x="40" y="145" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Full organization log</text>
  <text x="40" y="165" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Topic duration breakdown</text>
  <text x="40" y="185" font-family="sans-serif" font-size="10" fill="#e2e8f0">• All actions &amp; decisions</text>
  <rect x="40" y="198" width="150" height="20" rx="4" fill="#312e81" />
  <text x="48" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#c7d2fe">All-Hands &amp; Team Syncs</text>

  <!-- CARD 2: Executive Briefing (X=218) -->
  <rect x="218" y="75" width="180" height="155" rx="12" fill="#0d1f2d" fill-opacity="0.95" />
  <rect x="218" y="75" width="180" height="155" rx="12" fill="none" stroke="#38bdf8" stroke-width="1.8" class="laser-arch" />
  <circle cx="245" cy="104" r="14" fill="#0284c7" fill-opacity="0.4" />
  <text x="245" y="109" text-anchor="middle" font-size="13">📌</text>
  <text x="267" y="102" font-family="sans-serif" font-size="12" font-weight="800" fill="#bae6fd">C-Suite Brief</text>
  <text x="267" y="117" font-family="sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Chief of Staff</text>
  <text x="233" y="145" font-family="sans-serif" font-size="10" fill="#e2e8f0">• High-impact macro TL;DR</text>
  <text x="233" y="165" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Financials, ARR &amp; margins</text>
  <text x="233" y="185" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Critical project blockers</text>
  <rect x="233" y="198" width="150" height="20" rx="4" fill="#0369a1" />
  <text x="241" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#bae6fd">Board &amp; Leadership</text>

  <!-- CARD 3: Agile Daily Scrum (X=411) -->
  <rect x="411" y="75" width="180" height="155" rx="12" fill="#0c231c" fill-opacity="0.95" />
  <rect x="411" y="75" width="180" height="155" rx="12" fill="none" stroke="#10b981" stroke-width="1.8" class="laser-arch" />
  <circle cx="438" cy="104" r="14" fill="#047857" fill-opacity="0.4" />
  <text x="438" y="109" text-anchor="middle" font-size="13">🏃</text>
  <text x="460" y="102" font-family="sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">Daily Scrum</text>
  <text x="460" y="117" font-family="sans-serif" font-size="9" font-weight="600" fill="#34d399">Scrum Master</text>
  <text x="426" y="145" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Done, In-Progress &amp; Next</text>
  <text x="426" y="165" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Impediments &amp; blockers</text>
  <text x="426" y="185" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Sprint goal commitments</text>
  <rect x="426" y="198" width="150" height="20" rx="4" fill="#065f46" />
  <text x="434" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#a7f3d0">Standups &amp; Sprints</text>

  <!-- CARD 4: Technical Architecture (X=604) -->
  <rect x="604" y="75" width="180" height="155" rx="12" fill="#1e1333" fill-opacity="0.95" />
  <rect x="604" y="75" width="180" height="155" rx="12" fill="none" stroke="#c084fc" stroke-width="1.8" class="laser-arch" />
  <circle cx="631" cy="104" r="14" fill="#7e22ce" fill-opacity="0.4" />
  <text x="631" y="109" text-anchor="middle" font-size="13">🛠️</text>
  <text x="653" y="102" font-family="sans-serif" font-size="12" font-weight="800" fill="#f3e8ff">Architecture</text>
  <text x="653" y="117" font-family="sans-serif" font-size="9" font-weight="600" fill="#c084fc">Principal Architect</text>
  <text x="619" y="145" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Architecture Decision ADRs</text>
  <text x="619" y="165" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Latency, DB &amp; API metrics</text>
  <text x="619" y="185" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Tech debt &amp; trade-offs</text>
  <rect x="619" y="198" width="150" height="20" rx="4" fill="#581c87" />
  <text x="627" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#f3e8ff">Engineering &amp; Tech RFCs</text>

  <!-- CARD 5: Client Discovery (X=797) -->
  <rect x="797" y="75" width="180" height="155" rx="12" fill="#281a08" fill-opacity="0.95" />
  <rect x="797" y="75" width="180" height="155" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.8" class="laser-arch" />
  <circle cx="824" cy="104" r="14" fill="#b45309" fill-opacity="0.4" />
  <text x="824" y="109" text-anchor="middle" font-size="13">🤝</text>
  <text x="846" y="102" font-family="sans-serif" font-size="12" font-weight="800" fill="#fef3c7">Client Discovery</text>
  <text x="846" y="117" font-family="sans-serif" font-size="9" font-weight="600" fill="#f59e0b">Solutions Director</text>
  <text x="812" y="145" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Customer pain points</text>
  <text x="812" y="165" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Budget, timeline &amp; stack</text>
  <text x="812" y="185" font-family="sans-serif" font-size="10" fill="#e2e8f0">• Security &amp; compliance</text>
  <rect x="812" y="198" width="150" height="20" rx="4" fill="#78350f" />
  <text x="820" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#fef3c7">Sales &amp; Discovery Calls</text>
</svg>
