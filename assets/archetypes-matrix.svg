<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0c1222" />
    </linearGradient>

    <style>
      @keyframes archetypeGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.85; }
      }
      .arch-card-1 { animation: archetypeGlow 3s ease-in-out infinite; }
      .arch-card-2 { animation: archetypeGlow 3s ease-in-out infinite 0.6s; }
      .arch-card-3 { animation: archetypeGlow 3s ease-in-out infinite 1.2s; }
      .arch-card-4 { animation: archetypeGlow 3s ease-in-out infinite 1.8s; }
      .arch-card-5 { animation: archetypeGlow 3s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" rx="16" fill="url(#matrixCanvasBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Section Title -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">SPECIALIZED AI PERSONAS</text>
  <text x="35" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800" fill="#ffffff">5 Tailored Meeting Archetypes</text>

  <!-- CARD 1: Comprehensive Minutes (X=25) -->
  <rect x="25" y="85" width="180" height="135" rx="10" fill="#131b2e" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" class="arch-card-1" />
  <circle cx="50" cy="112" r="12" fill="#4338ca" fill-opacity="0.3" />
  <text x="50" y="117" text-anchor="middle" font-size="12">📝</text>
  <text x="70" y="116" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c7d2fe">Full Minutes</text>
  <text x="40" y="145" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Full organization record</text>
  <text x="40" y="163" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Topic duration breakdown</text>
  <text x="40" y="181" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• All actions &amp; decisions</text>
  <text x="40" y="205" font-family="sans-serif" font-size="9" font-weight="600" fill="#818cf8">All-Hands &amp; Syncs</text>

  <!-- CARD 2: Executive Briefing (X=218) -->
  <rect x="218" y="85" width="180" height="135" rx="10" fill="#0d1b2a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" class="arch-card-2" />
  <circle cx="243" cy="112" r="12" fill="#0284c7" fill-opacity="0.3" />
  <text x="243" y="117" text-anchor="middle" font-size="12">📌</text>
  <text x="263" y="116" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd">C-Suite Brief</text>
  <text x="233" y="145" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• High-impact macro TL;DR</text>
  <text x="233" y="163" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Financials, ARR &amp; margins</text>
  <text x="233" y="181" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Critical project blockers</text>
  <text x="233" y="205" font-family="sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Board &amp; Leadership</text>

  <!-- CARD 3: Agile Daily Scrum (X=411) -->
  <rect x="411" y="85" width="180" height="135" rx="10" fill="#0c1f19" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" class="arch-card-3" />
  <circle cx="436" cy="112" r="12" fill="#047857" fill-opacity="0.3" />
  <text x="436" y="117" text-anchor="middle" font-size="12">🏃</text>
  <text x="456" y="116" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">Daily Scrum</text>
  <text x="426" y="145" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Done, In-Progress &amp; Next</text>
  <text x="426" y="163" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Impediments &amp; blockers</text>
  <text x="426" y="181" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Sprint goal alignment</text>
  <text x="426" y="205" font-family="sans-serif" font-size="9" font-weight="600" fill="#34d399">Sprint &amp; Standups</text>

  <!-- CARD 4: Technical Architecture (X=604) -->
  <rect x="604" y="85" width="180" height="135" rx="10" fill="#1b122c" fill-opacity="0.85" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" class="arch-card-4" />
  <circle cx="629" cy="112" r="12" fill="#7e22ce" fill-opacity="0.3" />
  <text x="629" y="117" text-anchor="middle" font-size="12">🛠️</text>
  <text x="649" y="116" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f3e8ff">Architecture</text>
  <text x="619" y="145" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Architecture Decision Records</text>
  <text x="619" y="163" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Latency, DB &amp; API specs</text>
  <text x="619" y="181" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Tech debt &amp; trade-offs</text>
  <text x="619" y="205" font-family="sans-serif" font-size="9" font-weight="600" fill="#c084fc">Engineering Teams</text>

  <!-- CARD 5: Client Discovery (X=797) -->
  <rect x="797" y="85" width="180" height="135" rx="10" fill="#241708" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" class="arch-card-5" />
  <circle cx="822" cy="112" r="12" fill="#b45309" fill-opacity="0.3" />
  <text x="822" y="117" text-anchor="middle" font-size="12">🤝</text>
  <text x="842" y="116" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fef3c7">Client Discovery</text>
  <text x="812" y="145" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Customer pain points</text>
  <text x="812" y="163" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Budget, timeline &amp; stack</text>
  <text x="812" y="181" font-family="sans-serif" font-size="9.5" fill="#94a3b8">• Security &amp; compliance needs</text>
  <text x="812" y="205" font-family="sans-serif" font-size="9" font-weight="600" fill="#f59e0b">Sales &amp; Solutions</text>
</svg>
