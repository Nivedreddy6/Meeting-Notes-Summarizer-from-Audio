<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 32" width="130" height="32">
  <defs>
    <linearGradient id="bgSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120a02" />
      <stop offset="50%" stop-color="#201304" />
      <stop offset="100%" stop-color="#0c0701" />
    </linearGradient>

    <linearGradient id="borderSamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="sheenSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipSamp">
      <rect x="1.5" y="1.5" width="127" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseSamp {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.6)) drop-shadow(0 0 6px rgba(245, 158, 11, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 12px rgba(245, 158, 11, 0.6)); }
      }
      .pill-base-samp {
        animation: glowPulseSamp 2.5s ease-in-out infinite alternate;
      }
      @keyframes cubeFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      .cube-icon {
        animation: cubeFloat 2s ease-in-out infinite;
      }
      @keyframes chevronNudgeSamp {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-samp {
        animation: chevronNudgeSamp 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-base-samp">
    <rect x="1.5" y="1.5" width="127" height="29" rx="14.5" fill="url(#bgSamp)" stroke="url(#borderSamp)" stroke-width="1.8" />
  </g>

  <g clip-path="url(#pillClipSamp)">
    <path d="M 65 0 L 98 0 L 130 32 L 97 32 Z" fill="url(#sheenSamp)" />
    <rect x="5" y="2.5" width="120" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: 3D Isometric Package Cube (Gold) -->
  <g class="cube-icon">
    <!-- Top Face -->
    <polygon points="18,10 23,13 18,16 13,13" fill="#fde047" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="13,13 18,16 18,22 13,19" fill="#d97706" />
    <!-- Right Face -->
    <polygon points="18,16 23,13 23,19 18,22" fill="#b45309" />
  </g>

  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Test Demos</text>

  <g class="chev-samp">
    <path d="M 114 12 L 118 16 L 114 20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
