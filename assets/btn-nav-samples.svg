<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 44" width="185" height="44">
  <defs>
    <linearGradient id="bgSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c02" />
      <stop offset="50%" stop-color="#261704" />
      <stop offset="100%" stop-color="#0e0801" />
    </linearGradient>

    <linearGradient id="borderSamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="glossTopSamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="sweepGleamSamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipSamp">
      <rect x="2" y="2" width="181" height="40" rx="20" />
    </clipPath>

    <style>
      @keyframes neonBreatheSamp {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.7)) drop-shadow(0 0 10px rgba(245, 158, 11, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 9px rgba(251, 191, 36, 1)) drop-shadow(0 0 18px rgba(245, 158, 11, 0.8));
        }
      }

      @keyframes neonFlickerSamp {
        0%, 100% { opacity: 1; }
        36% { opacity: 1; }
        37% { opacity: 0.8; }
        38% { opacity: 1; }
        73% { opacity: 1; }
        74% { opacity: 0.75; }
        75% { opacity: 1; }
      }

      @keyframes gleamMoveSamp {
        0% { transform: translateX(-100px); }
        40%, 100% { transform: translateX(210px); }
      }

      @keyframes chevronNudgeSamp {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }

      .btn-outer-samp {
        animation: neonBreatheSamp 2.4s ease-in-out infinite alternate, neonFlickerSamp 5.3s infinite;
      }

      .gleam-runner-samp {
        animation: gleamMoveSamp 3.6s ease-in-out infinite;
      }

      .chevron-arrow-samp {
        animation: chevronNudgeSamp 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="btn-outer-samp">
    <rect x="2" y="2" width="181" height="40" rx="20" fill="url(#bgSamp)" stroke="url(#borderSamp)" stroke-width="2.4" />
  </g>

  <g clip-path="url(#pillClipSamp)">
    <rect x="6" y="4" width="173" height="17" rx="8.5" fill="url(#glossTopSamp)" />
    <ellipse cx="92" cy="40" rx="66" ry="2" fill="#f59e0b" opacity="0.3" />
    <rect class="gleam-runner-samp" x="0" y="0" width="35" height="44" fill="url(#sweepGleamSamp)" transform="skewX(-20)" />
  </g>

  <text x="22" y="27" font-size="16" text-anchor="middle">📦</text>
  <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.4">Test Demos</text>

  <g class="chevron-arrow-samp">
    <text x="162" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fde68a">&gt;</text>
  </g>
</svg>
