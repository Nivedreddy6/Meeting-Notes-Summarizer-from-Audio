<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" height="100%">
  <defs>
    <linearGradient id="flowCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -20; }
      }
      @keyframes pulseGlowBorder {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .flow-line {
        stroke-dasharray: 5, 5;
        animation: flowDash 1.2s linear infinite;
      }
      .step-card {
        animation: pulseGlowBorder 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="170" rx="14" fill="url(#flowCanvasBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Animated Connector Lines between Nodes -->
  <!-- Line 1 to 2 -->
  <line x1="230" y1="85" x2="265" y2="85" stroke="#38bdf8" stroke-width="2" class="flow-line" />
  <polygon points="265,81 273,85 265,89" fill="#38bdf8" />

  <!-- Line 2 to 3 -->
  <line x1="480" y1="85" x2="515" y2="85" stroke="#6366f1" stroke-width="2" class="flow-line" />
  <polygon points="515,81 523,85 515,89" fill="#6366f1" />

  <!-- Line 3 to 4 -->
  <line x1="730" y1="85" x2="765" y2="85" stroke="#a855f7" stroke-width="2" class="flow-line" />
  <polygon points="765,81 773,85 765,89" fill="#a855f7" />

  <!-- ================= NODE 1: AUDIO INGEST ================= -->
  <rect x="35" y="30" width="195" height="110" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" class="step-card" />
  <circle cx="62" cy="56" r="14" fill="#0284c7" fill-opacity="0.25" />
  <text x="62" y="62" text-anchor="middle" font-size="14">🎙️</text>
  <text x="85" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. CAPTURE</text>
  <text x="85" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Audio Ingestion</text>
  <text x="50" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">• Live Mic Recording</text>
  <text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">• MP3, WAV, M4A, WEBM</text>

  <!-- ================= NODE 2: STREAM & ENCODE ================= -->
  <rect x="285" y="30" width="195" height="110" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" class="step-card" />
  <circle cx="312" cy="56" r="14" fill="#4338ca" fill-opacity="0.25" />
  <text x="312" y="62" text-anchor="middle" font-size="14">⚡</text>
  <text x="335" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#818cf8">2. STREAM</text>
  <text x="335" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Node.js Engine</text>
  <text x="300" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">• Base64 chunk streaming</text>
  <text x="300" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">• Archetype JSON schemas</text>

  <!-- ================= NODE 3: GEMINI MULTIMODAL ================= -->
  <rect x="535" y="30" width="195" height="110" rx="10" fill="#17122a" fill-opacity="0.9" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" class="step-card" />
  <circle cx="562" cy="56" r="14" fill="#9333ea" fill-opacity="0.25" />
  <text x="562" y="62" text-anchor="middle" font-size="14">🧠</text>
  <text x="585" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c084fc">3. REASON</text>
  <text x="585" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Gemini 2.5 Flash</text>
  <text x="550" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Single-pass diarization</text>
  <text x="550" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#e9d5ff">• Decision &amp; action extraction</text>

  <!-- ================= NODE 4: REACT 19 UI ================= -->
  <rect x="775" y="30" width="190" height="110" rx="10" fill="#0d1f1b" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" class="step-card" />
  <circle cx="802" cy="56" r="14" fill="#059669" fill-opacity="0.25" />
  <text x="802" y="62" text-anchor="middle" font-size="14">⚛️</text>
  <text x="825" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">4. INTERACT</text>
  <text x="825" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">React 19 Board</text>
  <text x="790" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#d1fae5">• Interactive task checklist</text>
  <text x="790" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#d1fae5">• Grounded Q&amp;A AI Copilot</text>
</svg>
