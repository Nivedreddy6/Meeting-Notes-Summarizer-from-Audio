<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <style>
      @keyframes flowLaser {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes cardPulseGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.95; }
      }
      .flow-arrow {
        stroke-dasharray: 8, 4;
        animation: flowLaser 1.2s linear infinite;
      }
      .node-card {
        animation: cardPulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="180" rx="14" fill="url(#flowBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Animated Connector Arrows between Nodes -->
  <!-- Line 1 -> 2 -->
  <line x1="230" y1="90" x2="265" y2="90" stroke="#38bdf8" stroke-width="2.5" class="flow-arrow" />
  <polygon points="265,85 275,90 265,95" fill="#38bdf8" />

  <!-- Line 2 -> 3 -->
  <line x1="480" y1="90" x2="515" y2="90" stroke="#818cf8" stroke-width="2.5" class="flow-arrow" />
  <polygon points="515,85 525,90 515,95" fill="#818cf8" />

  <!-- Line 3 -> 4 -->
  <line x1="730" y1="90" x2="765" y2="90" stroke="#c084fc" stroke-width="2.5" class="flow-arrow" />
  <polygon points="765,85 775,90 765,95" fill="#c084fc" />

  <!-- ================= NODE 1: AUDIO INGEST ================= -->
  <rect x="35" y="25" width="195" height="130" rx="12" fill="#0c1e28" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.8" class="node-card" />
  <circle cx="62" cy="54" r="14" fill="#0284c7" fill-opacity="0.3" />
  <text x="62" y="60" text-anchor="middle" font-size="14">🎙️</text>
  <text x="85" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8">1. CAPTURE</text>
  <text x="85" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#f8fafc">Audio Ingestion</text>
  <text x="50" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Live Mic Recording</text>
  <text x="50" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• MP3, WAV, M4A, WEBM</text>
  <rect x="50" y="126" width="125" height="18" rx="4" fill="#0369a1" fill-opacity="0.6" />
  <text x="56" y="139" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#bae6fd">Browser Web Audio</text>

  <!-- ================= NODE 2: STREAM & ENCODE ================= -->
  <rect x="285" y="25" width="195" height="130" rx="12" fill="#131b2e" fill-opacity="0.95" stroke="#818cf8" stroke-width="1.8" class="node-card" />
  <circle cx="312" cy="54" r="14" fill="#4338ca" fill-opacity="0.3" />
  <text x="312" y="60" text-anchor="middle" font-size="14">⚡</text>
  <text x="335" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#818cf8">2. STREAM</text>
  <text x="335" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#f8fafc">Node.js Engine</text>
  <text x="300" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Base64 chunk stream</text>
  <text x="300" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Archetype schemas</text>
  <rect x="300" y="126" width="135" height="18" rx="4" fill="#312e81" fill-opacity="0.6" />
  <text x="306" y="139" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#c7d2fe">Zero-Dependency Proxy</text>

  <!-- ================= NODE 3: GEMINI MULTIMODAL ================= -->
  <rect x="535" y="25" width="195" height="130" rx="12" fill="#1b122e" fill-opacity="0.95" stroke="#c084fc" stroke-width="1.8" class="node-card" />
  <circle cx="562" cy="54" r="14" fill="#9333ea" fill-opacity="0.3" />
  <text x="562" y="60" text-anchor="middle" font-size="14">🧠</text>
  <text x="585" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#c084fc">3. REASON</text>
  <text x="585" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#f8fafc">Gemini 2.5 Flash</text>
  <text x="550" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e9d5ff">• Single-pass diarization</text>
  <text x="550" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e9d5ff">• Decisions &amp; task owners</text>
  <rect x="550" y="126" width="130" height="18" rx="4" fill="#581c87" fill-opacity="0.6" />
  <text x="556" y="139" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#f3e8ff">Single Multimodal Call</text>

  <!-- ================= NODE 4: REACT 19 UI ================= -->
  <rect x="775" y="25" width="190" height="130" rx="12" fill="#0d211b" fill-opacity="0.95" stroke="#10b981" stroke-width="1.8" class="node-card" />
  <circle cx="802" cy="54" r="14" fill="#059669" fill-opacity="0.3" />
  <text x="802" y="60" text-anchor="middle" font-size="14">⚛️</text>
  <text x="825" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#34d399">4. INTERACT</text>
  <text x="825" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#f8fafc">React 19 Board</text>
  <text x="790" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#d1fae5">• Interactive task board</text>
  <text x="790" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#d1fae5">• Grounded Q&amp;A Copilot</text>
  <rect x="790" y="126" width="130" height="18" rx="4" fill="#065f46" fill-opacity="0.6" />
  <text x="796" y="139" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#a7f3d0">Instant 60 FPS Board</text>
</svg>
