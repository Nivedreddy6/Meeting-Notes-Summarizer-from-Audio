<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="btnArchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <!-- Button Laser Gradients -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="laserPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laserGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Master Button Animated Gradient -->
    <linearGradient id="masterBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#6366f1;#059669;#0284c7" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0369a1">
        <animate attributeName="stop-color" values="#0369a1;#4338ca;#047857;#0369a1" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Marching Perimeter Laser -->
    <linearGradient id="deckBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#c084fc" />
      <stop offset="66%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      /* CSS KEYFRAME ANIMATIONS */
      @keyframes wireFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes buttonPulse {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.7)); }
      }
      @keyframes ledBlink {
        0%, 100% { fill-opacity: 0.4; }
        50% { fill-opacity: 1; }
      }
      @keyframes mainBtnGlow {
        0%, 100% { stroke: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
        50% { stroke: #10b981; filter: drop-shadow(0 0 16px #10b981); }
      }
      @keyframes laserBorderCycle {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -320; }
      }

      .deck-laser {
        stroke-dasharray: 80, 20;
        animation: laserBorderCycle 7s linear infinite;
      }
      .btn-wire {
        stroke-dasharray: 6, 4;
        animation: wireFlow 1.2s linear infinite;
      }
      .btn-wire-fast {
        stroke-dasharray: 5, 3;
        animation: wireFlow 0.8s linear infinite;
      }
      .active-led {
        animation: ledBlink 1.4s ease-in-out infinite;
      }
      .btn-stage {
        animation: buttonPulse 3s ease-in-out infinite;
      }
      .btn-action-glow {
        animation: mainBtnGlow 2.5s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="375" rx="16" fill="url(#btnArchBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="1000" height="375" rx="16" fill="none" stroke="url(#deckBorderLaser)" stroke-width="2" class="deck-laser" />

  <!-- Top Console Header Bar -->
  <rect x="0" y="0" width="1000" height="42" rx="16" fill="#0b1329" fill-opacity="0.95" />
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#eab308" />
  <circle cx="59" cy="21" r="5" fill="#22c55e" />
  <text x="82" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#38bdf8">ARCHITECTURE BUTTONS &amp; MULTIMODAL FLOW CONTROL DECK</text>
  <rect x="790" y="10" width="185" height="22" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
  <text x="882" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#c7d2fe">● MULTIMODAL PIPELINE</text>


  <!-- ================= ANIMATED CONNECTING BUS WIRES WITH MOVING DATA PACKETS ================= -->
  <!-- Wire 1 -> 2 -->
  <line x1="240" y1="160" x2="275" y2="160" stroke="url(#laserCyan)" stroke-width="3" class="btn-wire" />
  <polygon points="275,155 285,160 275,165" fill="#38bdf8" />
  <!-- SVG SMIL Packet 1 -->
  <circle cx="240" cy="160" r="3.5" fill="#38bdf8">
    <animate attributeName="cx" from="240" to="275" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Wire 2 -> 3 -->
  <line x1="485" y1="160" x2="520" y2="160" stroke="url(#laserPurple)" stroke-width="3" class="btn-wire-fast" />
  <polygon points="520,155 530,160 520,165" fill="#c084fc" />
  <!-- SVG SMIL Packet 2 -->
  <circle cx="485" cy="160" r="3.5" fill="#c084fc">
    <animate attributeName="cx" from="485" to="520" dur="0.8s" repeatCount="indefinite" />
  </circle>

  <!-- Wire 3 -> 4 -->
  <line x1="730" y1="160" x2="765" y2="160" stroke="url(#laserGreen)" stroke-width="3" class="btn-wire" />
  <polygon points="765,155 775,160 765,165" fill="#10b981" />
  <!-- SVG SMIL Packet 3 -->
  <circle cx="730" cy="160" r="3.5" fill="#10b981">
    <animate attributeName="cx" from="730" to="765" dur="1.2s" repeatCount="indefinite" />
  </circle>


  <!-- ================= BUTTON 1: CAPTURE & AUDIO INGEST ================= -->
  <g class="btn-stage">
    <rect x="30" y="65" width="210" height="195" rx="14" fill="#0c1e28" stroke="#38bdf8" stroke-width="2" />
    <!-- Clickable Button Header -->
    <rect x="42" y="78" width="186" height="34" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="58" cy="95" r="5" fill="#38bdf8" class="active-led">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="135" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff">BUTTON 1: CAPTURE</text>

    <!-- Button Content -->
    <circle cx="55" cy="138" r="14" fill="#0284c7" />
    <text x="55" y="144" text-anchor="middle" font-size="15">🎙️</text>
    <text x="78" y="136" font-family="sans-serif" font-size="11" font-weight="800" fill="#bae6fd">Audio Ingestion</text>
    <text x="78" y="150" font-family="sans-serif" font-size="9" fill="#7dd3fc">Web Audio API (16kHz)</text>

    <rect x="45" y="165" width="180" height="22" rx="4" fill="#082f49" />
    <text x="55" y="179" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Live Mic &amp; Canvas 60fps</text>
    <rect x="45" y="192" width="180" height="22" rx="4" fill="#082f49" />
    <text x="55" y="206" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• MP3, WAV, M4A, FLAC</text>

    <!-- Push Button State -->
    <rect x="45" y="222" width="180" height="26" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="239" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff">STATUS: ACTIVE BUFFER</text>
  </g>


  <!-- ================= BUTTON 2: STREAM & ENCODE HUB ================= -->
  <g class="btn-stage">
    <rect x="275" y="65" width="210" height="195" rx="14" fill="#131b2e" stroke="#818cf8" stroke-width="2" />
    <!-- Clickable Button Header -->
    <rect x="287" y="78" width="186" height="34" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="303" cy="95" r="5" fill="#818cf8" class="active-led">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <text x="380" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff">BUTTON 2: STREAM</text>

    <!-- Button Content -->
    <circle cx="300" cy="138" r="14" fill="#4338ca" />
    <text x="300" y="144" text-anchor="middle" font-size="15">⚡</text>
    <text x="323" y="136" font-family="sans-serif" font-size="11" font-weight="800" fill="#c7d2fe">Node.js Server</text>
    <text x="323" y="150" font-family="sans-serif" font-size="9" fill="#a5b4fc">Zero-Dependency Hub</text>

    <rect x="290" y="165" width="180" height="22" rx="4" fill="#1e1b4b" />
    <text x="300" y="179" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Base64 chunk streaming</text>
    <rect x="290" y="192" width="180" height="22" rx="4" fill="#1e1b4b" />
    <text x="300" y="206" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Archetype schema router</text>

    <!-- Push Button State -->
    <rect x="290" y="222" width="180" height="26" rx="6" fill="#3730a3" stroke="#818cf8" stroke-width="1" />
    <text x="380" y="239" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff">STATUS: PROXY CONNECTED</text>
  </g>


  <!-- ================= BUTTON 3: MULTIMODAL AI REASONING ================= -->
  <g class="btn-stage">
    <rect x="520" y="65" width="210" height="195" rx="14" fill="#1b122e" stroke="#c084fc" stroke-width="2" />
    <!-- Clickable Button Header -->
    <rect x="532" y="78" width="186" height="34" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="548" cy="95" r="5" fill="#c084fc" class="active-led">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <text x="625" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff">BUTTON 3: REASON</text>

    <!-- Button Content -->
    <circle cx="545" cy="138" r="14" fill="#7e22ce" />
    <text x="545" y="144" text-anchor="middle" font-size="15">🧠</text>
    <text x="568" y="136" font-family="sans-serif" font-size="11" font-weight="800" fill="#f3e8ff">Gemini 2.5 Flash</text>
    <text x="568" y="150" font-family="sans-serif" font-size="9" fill="#d8b4fe">Multimodal Core Engine</text>

    <rect x="535" y="165" width="180" height="22" rx="4" fill="#2e1065" />
    <text x="545" y="179" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Single-pass voice diarization</text>
    <rect x="535" y="192" width="180" height="22" rx="4" fill="#2e1065" />
    <text x="545" y="206" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• ADR &amp; action extraction</text>

    <!-- Push Button State -->
    <rect x="535" y="222" width="180" height="26" rx="6" fill="#6b21a8" stroke="#c084fc" stroke-width="1" />
    <text x="625" y="239" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff">STATUS: &lt;7.3s INFERENCE</text>
  </g>


  <!-- ================= BUTTON 4: REACT 19 RENDER DECK ================= -->
  <g class="btn-stage">
    <rect x="765" y="65" width="210" height="195" rx="14" fill="#08231a" stroke="#10b981" stroke-width="2" />
    <!-- Clickable Button Header -->
    <rect x="777" y="78" width="186" height="34" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <circle cx="793" cy="95" r="5" fill="#10b981" class="active-led">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <text x="870" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff">BUTTON 4: RENDER</text>

    <!-- Button Content -->
    <circle cx="790" cy="138" r="14" fill="#047857" />
    <text x="790" y="144" text-anchor="middle" font-size="15">⚛️</text>
    <text x="813" y="136" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">React 19 Deck</text>
    <text x="813" y="150" font-family="sans-serif" font-size="9" fill="#6ee7b7">Interactive UI Board</text>

    <rect x="780" y="165" width="180" height="22" rx="4" fill="#064e3b" />
    <text x="790" y="179" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Task Kanban with priority</text>
    <rect x="780" y="192" width="180" height="22" rx="4" fill="#064e3b" />
    <text x="790" y="206" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Grounded Copilot Q&amp;A</text>

    <!-- Push Button State -->
    <rect x="780" y="222" width="180" height="26" rx="6" fill="#047857" stroke="#10b981" stroke-width="1" />
    <text x="870" y="239" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff">STATUS: 60 FPS REACTIVE</text>
  </g>


  <!-- ================= BOTTOM ACTION CONTROLS / TRIGGER BUTTONS ================= -->
  <!-- Master Launch Button -->
  <rect x="30" y="290" width="280" height="60" rx="12" fill="url(#masterBtnGrad)" stroke="#38bdf8" stroke-width="2" class="btn-action-glow" />
  <text x="170" y="317" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff">▶ RUN MULTIMODAL FLOW</text>
  <text x="170" y="337" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#bae6fd">Single-Pass Speech-To-Decisions</text>

  <!-- Trigger Button 2: Turbo Speedup -->
  <rect x="330" y="290" width="200" height="60" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6" />
  <text x="430" y="317" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="900" fill="#c7d2fe">⚡ 8.9x TURBO SPEED</text>
  <text x="430" y="337" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a5b4fc">85% Latency Reduction</text>

  <!-- Trigger Button 3: In-Memory Privacy -->
  <rect x="550" y="290" width="200" height="60" rx="12" fill="#062e24" stroke="#10b981" stroke-width="1.6" />
  <text x="650" y="317" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="900" fill="#a7f3d0">🔒 ZERO DISK WRITES</text>
  <text x="650" y="337" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6ee7b7">RAM-Only Privacy Stream</text>

  <!-- Trigger Button 4: 1-Click Export -->
  <rect x="770" y="290" width="205" height="60" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.6" />
  <text x="872" y="317" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="900" fill="#fef3c7">📄 1-CLICK EXPORTS</text>
  <text x="872" y="337" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fde68a">PDF • Markdown • JSON</text>
</svg>
