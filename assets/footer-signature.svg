<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#04060e" />
    </linearGradient>

    <!-- Shifting Gradient for Nived Reddy's Name -->
    <linearGradient id="nameShiftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f43f5e;#fbbf24;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f43f5e;#fbbf24;#38bdf8;#c084fc" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#38bdf8;#c084fc;#f43f5e;#fbbf24" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Marching Perimeter Laser -->
    <linearGradient id="footerBorderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#a855f7" />
      <stop offset="66%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      /* CSS KEYFRAME ANIMATIONS */
      @keyframes laserBorderCycle {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes eqPulseSide {
        0%, 100% { height: 4px; y: 104px; }
        50% { height: 26px; y: 82px; }
      }
      @keyframes btnGlowHover {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.8)); }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }

      .footer-laser {
        stroke-dasharray: 100, 25;
        animation: laserBorderCycle 6s linear infinite;
      }
      .foot-eq-1 { animation: eqPulseSide 0.9s ease-in-out infinite alternate; }
      .foot-eq-2 { animation: eqPulseSide 1.2s ease-in-out infinite alternate 0.2s; }
      .foot-eq-3 { animation: eqPulseSide 0.7s ease-in-out infinite alternate 0.4s; }
      .foot-eq-4 { animation: eqPulseSide 1.1s ease-in-out infinite alternate 0.1s; }

      .foot-btn { animation: btnGlowHover 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="220" rx="16" fill="url(#footerBg)" />
  <!-- Marching Laser Border -->
  <rect width="1000" height="220" rx="16" fill="none" stroke="url(#footerBorderLaser)" stroke-width="2" class="footer-laser" />

  <!-- Top Creator Pill Badge -->
  <rect x="380" y="22" width="240" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
  <circle cx="398" cy="35" r="4" fill="#38bdf8" />
  <text x="500" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5" fill="#c7d2fe">LEAD AI ARCHITECT &amp; CREATOR</text>

  <!-- Left Side Equalizer Waveforms -->
  <g fill="#38bdf8" opacity="0.8">
    <rect class="foot-eq-1" x="180" y="104" width="4" height="6" rx="2" />
    <rect class="foot-eq-2" x="190" y="100" width="4" height="12" rx="2" />
    <rect class="foot-eq-3" x="200" y="94" width="4" height="18" rx="2" />
    <rect class="foot-eq-4" x="210" y="88" width="4" height="24" rx="2" fill="#818cf8" />
    <rect class="foot-eq-1" x="220" y="98" width="4" height="14" rx="2" />
    <rect class="foot-eq-2" x="230" y="104" width="4" height="6" rx="2" />
  </g>

  <!-- Right Side Equalizer Waveforms -->
  <g fill="#c084fc" opacity="0.8">
    <rect class="foot-eq-2" x="770" y="104" width="4" height="6" rx="2" />
    <rect class="foot-eq-1" x="780" y="98" width="4" height="14" rx="2" />
    <rect class="foot-eq-4" x="790" y="88" width="4" height="24" rx="2" fill="#818cf8" />
    <rect class="foot-eq-3" x="800" y="94" width="4" height="18" rx="2" />
    <rect class="foot-eq-2" x="810" y="100" width="4" height="12" rx="2" />
    <rect class="foot-eq-1" x="820" y="104" width="4" height="6" rx="2" />
  </g>

  <!-- Big Animated Signature Name: NIVED REDDY -->
  <text x="500" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="url(#nameShiftGrad)">
    NIVED REDDY
  </text>

  <!-- Subtitle -->
  <text x="500" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Architected with React 19 • Google Gemini 2.5 Flash • Web Audio API Engine
  </text>

  <!-- 3 Interactive Action Buttons -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800">
    <!-- GitHub Profile Button -->
    <rect x="230" y="152" width="165" height="34" rx="8" fill="#131e33" stroke="#38bdf8" stroke-width="1.4" class="foot-btn" />
    <circle cx="248" cy="169" r="6" fill="#0284c7" />
    <text x="248" y="173" text-anchor="middle" font-size="9" fill="#ffffff">🐙</text>
    <text x="262" y="173" fill="#e0f2fe">@Nivedreddy6</text>

    <!-- Live Project Badge -->
    <rect x="410" y="152" width="180" height="34" rx="8" fill="#201335" stroke="#c084fc" stroke-width="1.4" class="foot-btn" />
    <text x="500" y="173" text-anchor="middle" fill="#f3e8ff">⚡ OmniNote AI Suite</text>

    <!-- Star Repo Button -->
    <rect x="605" y="152" width="165" height="34" rx="8" fill="#2d1c04" stroke="#f59e0b" stroke-width="1.4" class="foot-btn" />
    <text x="687" y="173" text-anchor="middle" fill="#fef08a">⭐ Star on GitHub</text>
  </g>

  <!-- Bottom Copyright Line -->
  <text x="500" y="206" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">
    © 2026 Nived Reddy. Released under the MIT Open Source License.
  </text>
</svg>
