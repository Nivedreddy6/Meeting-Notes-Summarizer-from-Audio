        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.85; }
      }
      .glow-border-1 { animation: borderGlow 3s ease-in-out infinite; }
      .glow-border-2 { animation: borderGlow 3s ease-in-out infinite 0.75s; }
      .glow-border-3 { animation: borderGlow 3s ease-in-out infinite 1.5s; }
      .glow-border-4 { animation: borderGlow 3s ease-in-out infinite 2.25s; }
