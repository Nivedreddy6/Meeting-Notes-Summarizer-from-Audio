<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40">
  <defs>
    <!-- Dark Glass Capsule Background -->
    <linearGradient id="bgTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120c" />
      <stop offset="50%" stop-color="#082015" />
      <stop offset="100%" stop-color="#020d09" />
    </linearGradient>

    <!-- Glowing Emerald Green Border -->
    <linearGradient id="borderTools" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="glowRingTools" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Diagonal Specular Gloss Sheen -->
    <linearGradient id="sheenTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipTools">
      <rect x="4" y="4" width="142" height="32" rx="16" />
    </clipPath>

    <style>
      @keyframes neonBreatheTools {
        0%, 100% { opacity: 0.35; stroke-width: 2.5; }
        50% { opacity: 0.75; stroke-width: 3.5; }
      }
      .glow-halo-tools {
        animation: neonBreatheTools 2.2s ease-in-out infinite alternate;
      }
      @keyframes satWavePulse {
        0% { opacity: 0.1; }
        50% { opacity: 1; }
        100% { opacity: 0.1; }
      }
      .sat-wave-1 { animation: satWavePulse 1.4s ease-in-out infinite; }
      .sat-wave-2 { animation: satWavePulse 1.4s ease-in-out infinite 0.35s; }
      .sat-wave-3 { animation: satWavePulse 1.4s ease-in-out infinite 0.7s; }

      @keyframes chevronNudgeTools {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-tools {
        animation: chevronNudgeTools 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 100% ROUND OUTER GLOW AURA (Zero square edges, pure pill shape with transparent padding) -->
  <rect class="glow-halo-tools" x="2.5" y="2.5" width="145" height="35" rx="17.5" fill="none" stroke="url(#glowRingTools)" stroke-width="2.5" />

  <!-- Main Round Pill Capsule Base -->
  <rect x="4" y="4" width="142" height="32" rx="16" fill="url(#bgTools)" stroke="url(#borderTools)" stroke-width="1.8" />

  <!-- Diagonal Specular Glass Reflection (Clipped to Pill) -->
  <g clip-path="url(#pillClipTools)">
    <path d="M 76 4 L 109 4 L 146 36 L 112 36 Z" fill="url(#sheenTools)" />
    <rect x="9" y="6.5" width="132" height="12" rx="6" fill="#ffffff" opacity="0.09" />
  </g>

  <!-- ================= SVG SATELLITE DISH / ANTENNA WITH ANIMATED EMITTING BROADCAST WAVES ================= -->
  <g transform="translate(5, 4)">
    <!-- Tripod / Stand Base -->
    <path d="M 13,24 L 17,18 L 21,24" fill="none" stroke="#34d399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="17" y1="18" x2="17" y2="23" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" />

    <!-- Transmitter Orb -->
    <circle cx="17" cy="17" r="2.2" fill="#34d399" />
    <circle cx="17" cy="17" r="1" fill="#ffffff" />

    <!-- Wave 1 (Inner Arc) -->
    <path class="sat-wave-1" d="M 14,14 A 4.2 4.2 0 0 1 20,14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.4s" repeatCount="indefinite" />
    </path>

    <!-- Wave 2 (Middle Arc) -->
    <path class="sat-wave-2" d="M 12,11.5 A 7 7 0 0 1 22,11.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.4s" begin="0.35s" repeatCount="indefinite" />
    </path>

    <!-- Wave 3 (Outer Arc) -->
    <path class="sat-wave-3" d="M 10,9 A 10 10 0 0 1 24,9" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.4s" begin="0.7s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Button Text Label -->
  <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Tools &amp; Tech</text>

  <!-- Right Animated Chevron -->
  <g class="chev-tools">
    <path d="M 130 16 L 134 20 L 130 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
