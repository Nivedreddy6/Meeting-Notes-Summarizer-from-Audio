<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 40" width="132" height="40">
  <defs>
    <linearGradient id="bgRepo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02100e" />
      <stop offset="50%" stop-color="#04201c" />
      <stop offset="100%" stop-color="#010a08" />
    </linearGradient>

    <linearGradient id="borderRepo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="glowRingRepo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="sheenRepo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipRepo">
      <rect x="4" y="4" width="124" height="32" rx="16" />
    </clipPath>

    <style>
      @keyframes neonBreatheRepo {
        0%, 100% { opacity: 0.35; stroke-width: 2.5; }
        50% { opacity: 0.75; stroke-width: 3.5; }
      }
      .glow-halo-repo {
        animation: neonBreatheRepo 2.2s ease-in-out infinite alternate;
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .term-cursor {
        animation: cursorBlink 0.8s infinite;
      }
      @keyframes chevronNudgeRepo {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-repo {
        animation: chevronNudgeRepo 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 100% ROUND OUTER GLOW AURA (Zero square edges, pure pill shape with transparent padding) -->
  <rect class="glow-halo-repo" x="2.5" y="2.5" width="127" height="35" rx="17.5" fill="none" stroke="url(#glowRingRepo)" stroke-width="2.5" />

  <!-- Main Round Pill Capsule Base -->
  <rect x="4" y="4" width="124" height="32" rx="16" fill="url(#bgRepo)" stroke="url(#borderRepo)" stroke-width="1.8" />

  <!-- Diagonal Specular Glass Reflection (Clipped to Pill) -->
  <g clip-path="url(#pillClipRepo)">
    <path d="M 66 4 L 97 4 L 128 36 L 97 36 Z" fill="url(#sheenRepo)" />
    <rect x="9" y="6.5" width="114" height="12" rx="6" fill="#ffffff" opacity="0.09" />
  </g>

  <!-- SVG Vector Icon: Terminal Prompt with Blinking Cursor -->
  <g transform="translate(5, 4)">
    <path d="M 13,12 L 17,16 L 13,20" fill="none" stroke="#2dd4bf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    <line class="term-cursor" x1="18.5" y1="20" x2="23.5" y2="20" stroke="#5eead4" stroke-width="1.7" stroke-linecap="round" />
  </g>

  <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Repo Tree</text>

  <g class="chev-repo">
    <path d="M 112 16 L 116 20 L 112 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
