<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 46" width="180" height="46">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021018" />
      <stop offset="50%" stop-color="#051f30" />
      <stop offset="100%" stop-color="#010a10" />
    </linearGradient>

    <linearGradient id="glowArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sheenArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipArch">
      <rect x="2" y="2" width="176" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseArch {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.5)) drop-shadow(0 0 8px rgba(0, 210, 255, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 16px rgba(0, 210, 255, 0.6));
        }
      }
      .pill-container-arch {
        animation: neonPulseArch 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
    </style>
  </defs>

  <g class="pill-container-arch">
    <rect x="2" y="2" width="176" height="42" rx="21" fill="url(#bgArch)" stroke="url(#glowArch)" stroke-width="2.2" />

    <g clip-path="url(#pillClipArch)">
      <path d="M 100 0 L 145 0 L 180 46 L 135 46 Z" fill="url(#sheenArch)" />
      <ellipse cx="90" cy="5" rx="75" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <text x="22" y="28" font-size="16" text-anchor="middle">🧊</text>
    <text x="91" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Architecture</text>
    <text x="158" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#38bdf8">&gt;</text>
  </g>
</svg>
