<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 46" width="180" height="46">
  <defs>
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140404" />
      <stop offset="50%" stop-color="#260808" />
      <stop offset="100%" stop-color="#0e0202" />
    </linearGradient>

    <linearGradient id="glowBench" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="sheenBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#fca5a5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipBench">
      <rect x="2" y="2" width="176" height="42" rx="21" />
    </clipPath>

    <style>
      @keyframes neonPulseBench {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.5)) drop-shadow(0 0 8px rgba(239, 68, 68, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.9)) drop-shadow(0 0 16px rgba(239, 68, 68, 0.6));
        }
      }
      .pill-container-bench {
        animation: neonPulseBench 2.5s ease-in-out infinite alternate;
        cursor: pointer;
      }
    </style>
  </defs>

  <g class="pill-container-bench">
    <rect x="2" y="2" width="176" height="42" rx="21" fill="url(#bgBench)" stroke="url(#glowBench)" stroke-width="2.2" />

    <g clip-path="url(#pillClipBench)">
      <path d="M 100 0 L 145 0 L 180 46 L 135 46 Z" fill="url(#sheenBench)" />
      <ellipse cx="90" cy="5" rx="75" ry="3" fill="#ffffff" opacity="0.25" />
    </g>

    <text x="22" y="28" font-size="16" text-anchor="middle">⚡</text>
    <text x="91" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Benchmarks</text>
    <text x="158" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fca5a5">&gt;</text>
  </g>
</svg>
