<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 44" width="184" height="44">
  <defs>
    <linearGradient id="bgWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c20" />
      <stop offset="50%" stop-color="#141738" />
      <stop offset="100%" stop-color="#060714" />
    </linearGradient>

    <linearGradient id="borderWork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="glossTopWork" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="sweepGleamWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipWork">
      <rect x="2" y="2" width="180" height="40" rx="20" />
    </clipPath>

    <style>
      @keyframes neonBreatheWork {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.7)) drop-shadow(0 0 10px rgba(99, 102, 241, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 9px rgba(129, 140, 248, 1)) drop-shadow(0 0 18px rgba(99, 102, 241, 0.8));
        }
      }

      @keyframes neonFlickerWork {
        0%, 100% { opacity: 1; }
        41% { opacity: 1; }
        42% { opacity: 0.82; }
        43% { opacity: 1; }
        79% { opacity: 1; }
        80% { opacity: 0.76; }
        81% { opacity: 1; }
      }

      @keyframes gleamMoveWork {
        0% { transform: translateX(-100px); }
        40%, 100% { transform: translateX(210px); }
      }

      @keyframes chevronNudgeWork {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }

      .btn-outer-work {
        animation: neonBreatheWork 2.4s ease-in-out infinite alternate, neonFlickerWork 5.1s infinite;
      }

      .gleam-runner-work {
        animation: gleamMoveWork 3.6s ease-in-out infinite;
      }

      .chevron-arrow-work {
        animation: chevronNudgeWork 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="btn-outer-work">
    <rect x="2" y="2" width="180" height="40" rx="20" fill="url(#bgWork)" stroke="url(#borderWork)" stroke-width="2.4" />
  </g>

  <g clip-path="url(#pillClipWork)">
    <rect x="6" y="4" width="172" height="17" rx="8.5" fill="url(#glossTopWork)" />
    <ellipse cx="92" cy="40" rx="65" ry="2" fill="#6366f1" opacity="0.3" />
    <rect class="gleam-runner-work" x="0" y="0" width="35" height="44" fill="url(#sweepGleamWork)" transform="skewX(-20)" />
  </g>

  <text x="22" y="27" font-size="16" text-anchor="middle">🖥️</text>
  <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.4">Workspace</text>

  <g class="chevron-arrow-work">
    <text x="162" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#a5b4fc">&gt;</text>
  </g>
</svg>
