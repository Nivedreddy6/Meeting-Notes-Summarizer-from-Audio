<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 32" width="126" height="32">
  <defs>
    <linearGradient id="bgWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a18" />
      <stop offset="50%" stop-color="#121530" />
      <stop offset="100%" stop-color="#060712" />
    </linearGradient>

    <linearGradient id="borderWork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="sheenWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="pillClipWork">
      <rect x="1.5" y="1.5" width="123" height="29" rx="14.5" />
    </clipPath>

    <style>
      @keyframes glowPulseWork {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(99, 102, 241, 0.6)) drop-shadow(0 0 6px rgba(99, 102, 241, 0.3)); }
        50% { filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.9)) drop-shadow(0 0 12px rgba(99, 102, 241, 0.6)); }
      }
      .pill-base-work {
        animation: glowPulseWork 2.5s ease-in-out infinite alternate;
      }
      @keyframes bubbleFloat1 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-7px); opacity: 0; }
      }
      @keyframes bubbleFloat2 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-8px); opacity: 0; }
      }
      .bub-1 { animation: bubbleFloat1 1.5s ease-in infinite; }
      .bub-2 { animation: bubbleFloat2 1.8s ease-in infinite 0.6s; }

      @keyframes chevronNudgeWork {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      .chev-work {
        animation: chevronNudgeWork 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pill-base-work">
    <rect x="1.5" y="1.5" width="123" height="29" rx="14.5" fill="url(#bgWork)" stroke="url(#borderWork)" stroke-width="1.8" />
  </g>

  <g clip-path="url(#pillClipWork)">
    <path d="M 64 0 L 96 0 L 126 32 L 96 32 Z" fill="url(#sheenWork)" />
    <rect x="5" y="2.5" width="116" height="12" rx="6" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- SVG Vector Icon: Chemistry Flask with Rising Bubbles -->
  <g transform="translate(1, 0)">
    <!-- Flask Outline -->
    <path d="M 16,8 L 20,8 L 20,12 L 23.5,21.5 A 1.8 1.8 0 0 1 21.8,24 L 14.2,24 A 1.8 1.8 0 0 1 12.5,21.5 L 16,12 Z" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-linejoin="round" />
    <!-- Fluid inside -->
    <path d="M 13.8,21.5 L 15,18 L 21,18 L 22.2,21.5 A 1 1 0 0 1 21.3,22.5 L 14.7,22.5 A 1 1 0 0 1 13.8,21.5 Z" fill="#6366f1" opacity="0.65" />
    <!-- Rising Bubbles -->
    <circle class="bub-1" cx="16.5" cy="19.5" r="1.1" fill="#c7d2fe" />
    <circle class="bub-2" cx="19" cy="20.5" r="1.3" fill="#ffffff" />
  </g>

  <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.3">Workspace</text>

  <g class="chev-work">
    <path d="M 110 12 L 114 16 L 110 20" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
