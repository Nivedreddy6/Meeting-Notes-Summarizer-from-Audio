<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="25%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="75%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Neon Title Gradient with Continuous Color Animation -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f43f5e;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#38bdf8;#818cf8;#f43f5e" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Equalizer Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Marching Laser Border Gradient -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#818cf8" />
      <stop offset="66%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      /* CSS KEYFRAME ANIMATIONS */
      @keyframes laserMarch {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }

      @keyframes eqBounce1 {
        0%, 100% { height: 8px; y: 172px; }
        50% { height: 46px; y: 134px; }
      }
      @keyframes eqBounce2 {
        0%, 100% { height: 12px; y: 168px; }
        50% { height: 52px; y: 128px; }
      }
      @keyframes eqBounce3 {
        0%, 100% { height: 6px; y: 174px; }
        50% { height: 38px; y: 142px; }
      }

      @keyframes neonBorderShift {
        0% { stroke: #38bdf8; }
        33% { stroke: #a855f7; }
        66% { stroke: #ec4899; }
        100% { stroke: #38bdf8; }
      }

      @keyframes pillGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1; }
      }

      .animated-border {
        stroke-dasharray: 120, 30;
        animation: laserMarch 6s linear infinite;
      }

      .eq1 { animation: eqBounce1 1.1s ease-in-out infinite alternate; }
      .eq2 { animation: eqBounce2 0.85s ease-in-out infinite alternate; }
      .eq3 { animation: eqBounce3 1.3s ease-in-out infinite alternate; }

      .d1 { animation-delay: 0.05s; }
      .d2 { animation-delay: 0.25s; }
      .d3 { animation-delay: 0.45s; }
      .d4 { animation-delay: 0.15s; }
      .d5 { animation-delay: 0.35s; }
      .d6 { animation-delay: 0.55s; }
      .d7 { animation-delay: 0.1s; }
      .d8 { animation-delay: 0.3s; }
      .d9 { animation-delay: 0.5s; }
      .d10 { animation-delay: 0.2s; }

      .badge-laser {
        animation: neonBorderShift 4s ease-in-out infinite alternate, pillGlow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="300" rx="16" fill="url(#heroBg)" />

  <!-- Animated Marching Neon Perimeter Laser Border -->
  <rect width="1000" height="300" rx="16" fill="none" stroke="url(#borderLaser)" stroke-width="2.5" class="animated-border" />

  <!-- Decorative Ambient Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1000" y2="75" />
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="225" x2="1000" y2="225" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
  </g>

  <!-- 1. Top Live Radar Status Pill -->
  <rect x="350" y="24" width="300" height="30" rx="15" fill="#131b2e" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" />
  <!-- Expanding Radar Ring Animation -->
  <circle cx="372" cy="39" r="5" fill="#10b981" />
  <circle cx="372" cy="39" r="5" fill="none" stroke="#10b981" stroke-width="1.5">
    <animate attributeName="r" values="5;14;5" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="388" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" fill="#e0f2fe">MULTIMODAL AUDIO INTELLIGENCE</text>

  <!-- 2. Main Title with Color Shift Animation -->
  <text x="500" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5" fill="#ffffff">
    OmniNote <tspan fill="url(#neonTitle)">AI</tspan>
  </text>

  <!-- 3. Subtitle -->
  <text x="500" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
    Meeting Notes Summarizer • Decision Diarization • Interactive Copilot
  </text>

  <!-- 4. Highly Dynamic Audio Frequency Equalizer (25 Bars with CSS Keyframe Bounce) -->
  <g opacity="0.9">
    <rect class="eq1 d1" x="330" y="170" width="5" height="15" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d2" x="344" y="165" width="5" height="22" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq3 d3" x="358" y="172" width="5" height="12" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d4" x="372" y="160" width="5" height="30" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d5" x="386" y="166" width="5" height="20" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d6" x="400" y="152" width="5" height="38" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq3 d7" x="414" y="162" width="5" height="24" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d8" x="428" y="148" width="5" height="42" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d9" x="442" y="158" width="5" height="28" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d10" x="456" y="144" width="5" height="48" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d1" x="470" y="154" width="5" height="34" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d3" x="484" y="140" width="5" height="52" rx="2.5" fill="url(#eqGrad)" />
    <!-- Center Peak -->
    <rect class="eq1 d5" x="498" y="136" width="5" height="56" rx="2.5" fill="#38bdf8" />
    <rect class="eq2 d2" x="512" y="140" width="5" height="52" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d4" x="526" y="154" width="5" height="34" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d6" x="540" y="144" width="5" height="48" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d8" x="554" y="158" width="5" height="28" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d10" x="568" y="148" width="5" height="42" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq3 d7" x="582" y="162" width="5" height="24" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d5" x="596" y="152" width="5" height="38" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d3" x="610" y="166" width="5" height="20" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d1" x="624" y="160" width="5" height="30" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq3 d4" x="638" y="172" width="5" height="12" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq2 d2" x="652" y="165" width="5" height="22" rx="2.5" fill="url(#eqGrad)" />
    <rect class="eq1 d6" x="666" y="170" width="5" height="15" rx="2.5" fill="url(#eqGrad)" />
  </g>

  <!-- 5. Bottom Neon Technology Badges with CSS Border Glow -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
    <!-- React 19 -->
    <rect x="210" y="232" width="125" height="32" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.5" class="badge-laser" />
    <circle cx="226" cy="248" r="4" fill="#38bdf8" />
    <text x="238" y="253" fill="#e0f2fe">⚛️ React 19</text>

    <!-- Gemini 2.5 Flash -->
    <rect x="350" y="232" width="170" height="32" rx="8" fill="#17122a" fill-opacity="0.95" stroke="#c084fc" stroke-width="1.5" class="badge-laser" />
    <text x="364" y="253" fill="#f3e8ff">✨ Gemini 2.5 Flash</text>

    <!-- Live Mic Stream -->
    <rect x="535" y="232" width="130" height="32" rx="8" fill="#062e24" fill-opacity="0.95" stroke="#10b981" stroke-width="1.5" class="badge-laser" />
    <text x="549" y="253" fill="#a7f3d0">🎙️ Live Ingest</text>

    <!-- Grounded AI Copilot -->
    <rect x="680" y="232" width="140" height="32" rx="8" fill="#201a08" fill-opacity="0.95" stroke="#f59e0b" stroke-width="1.5" class="badge-laser" />
    <text x="694" y="253" fill="#fef3c7">💬 AI Copilot</text>
  </g>
</svg>
