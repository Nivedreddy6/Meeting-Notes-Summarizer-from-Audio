<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Radial Ambient Glows (No feGaussianBlur = 100% GitHub Safe) -->
    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes eqPulse {
        0%, 100% { height: 16px; y: 220px; }
        50% { height: 75px; y: 160px; }
      }

      @keyframes glowPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .eq-bar {
        animation: eqPulse 1.2s ease-in-out infinite alternate;
      }
      .b1 { animation-delay: 0.05s; }
      .b2 { animation-delay: 0.25s; }
      .b3 { animation-delay: 0.5s; }
      .b4 { animation-delay: 0.15s; }
      .b5 { animation-delay: 0.4s; }
      .b6 { animation-delay: 0.65s; }
      .b7 { animation-delay: 0.1s; }
      .b8 { animation-delay: 0.35s; }
      .b9 { animation-delay: 0.6s; }
      .b10 { animation-delay: 0.2s; }
      .b11 { animation-delay: 0.45s; }
      .b12 { animation-delay: 0.7s; }

      .card-border {
        animation: glowPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Soft Ambient Glow Orbs -->
  <circle cx="220" cy="180" r="260" fill="url(#indigoGlow)" />
  <circle cx="950" cy="180" r="280" fill="url(#cyanGlow)" />

  <!-- Subtle Vector Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Center Animated Frequency Equalizer Waves -->
  <g opacity="0.4">
    <rect class="eq-bar b1" x="500" y="200" width="6" height="35" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b2" x="512" y="190" width="6" height="45" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b3" x="524" y="210" width="6" height="25" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b4" x="536" y="180" width="6" height="55" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b5" x="548" y="200" width="6" height="35" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b6" x="560" y="170" width="6" height="65" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b7" x="572" y="195" width="6" height="40" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b8" x="584" y="185" width="6" height="50" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b9" x="596" y="205" width="6" height="30" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b10" x="608" y="175" width="6" height="60" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b11" x="620" y="190" width="6" height="45" rx="3" fill="url(#waveGrad)" />
    <rect class="eq-bar b12" x="632" y="210" width="6" height="25" rx="3" fill="url(#waveGrad)" />
  </g>

  <!-- LEFT COLUMN: Brand, Titles & Badges (Clean Static Coordinates) -->
  <!-- Top Innovation Pill -->
  <rect x="70" y="48" width="265" height="30" rx="15" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" />
  <circle cx="86" cy="63" r="4" fill="#38bdf8" />
  <text x="98" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">Next-Gen Audio Intelligence</text>

  <!-- Main Title -->
  <text x="70" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#ffffff">
    OmniNote <tspan fill="url(#textGrad)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">
    Intelligent Meeting Summarizer from Audio
  </text>
  <text x="70" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    Single-pass multimodal audio reasoning, speaker diarization &amp; grounded Q&amp;A
  </text>

  <!-- Feature Badges Row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <!-- React 19 -->
    <rect x="70" y="225" width="105" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="84" cy="241" r="4" fill="#38bdf8" />
    <text x="95" y="245" fill="#e0f2fe">React 19</text>

    <!-- Gemini 2.5 Flash -->
    <rect x="185" y="225" width="165" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <text x="198" y="245" fill="#f3e8ff">✨ Gemini 2.5 Flash</text>

    <!-- Live Mic -->
    <rect x="360" y="225" width="115" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="372" y="245" fill="#d1fae5">🎙️ Live Mic</text>

    <!-- AI Copilot -->
    <rect x="485" y="225" width="125" height="32" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="498" y="245" fill="#fef3c7">⚡ AI Copilot</text>
  </g>

  <!-- RIGHT COLUMN: Glassmorphic Intelligence Card (Explicit Coordinates X=690) -->
  <rect x="690" y="45" width="440" height="270" rx="16" fill="#111827" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2" class="card-border" />

  <!-- Card Window Header -->
  <circle cx="715" cy="70" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="731" cy="70" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="747" cy="70" r="5" fill="#10b981" opacity="0.8" />
  <rect x="1000" y="60" width="110" height="20" rx="10" fill="#6366f1" fill-opacity="0.2" />
  <text x="1018" y="74" font-family="sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">AI REASONING</text>

  <!-- Card Details -->
  <text x="715" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Q4 Architecture &amp; Sprint Modernization</text>
  <text x="715" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Duration: 42 min • 4 Speakers • High Alignment</text>

  <!-- Item 1: Decision -->
  <rect x="715" y="136" width="390" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
  <text x="728" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">💡 KEY DECISION LOGGED</text>
  <text x="728" y="167" font-family="sans-serif" font-size="11" fill="#cbd5e1">Adopt Redis Sentinel cluster for 65% primary DB load reduction</text>

  <!-- Item 2: Action Item -->
  <rect x="715" y="188" width="390" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
  <text x="728" y="204" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">✅ ACTION ITEM</text>
  <text x="728" y="219" font-family="sans-serif" font-size="11" fill="#cbd5e1">Marcus Vance: Benchmark connection pooling by Friday</text>

  <!-- Item 3: AI Copilot -->
  <rect x="715" y="240" width="390" height="48" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
  <text x="728" y="256" font-family="sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">💬 MEETING COPILOT</text>
  <text x="728" y="273" font-family="sans-serif" font-size="11" fill="#e2e8f0">"Failover verified under 3s with zero customer downtime."</text>
</svg>
